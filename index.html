<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>철도비서</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif
}

html,body{
  width:100%;
  min-height:100%;
  background:#f1f5f9;
  color:#172033
}

body{
  display:flex;
  justify-content:center
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.container{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:#f1f5f9;
  position:relative;
  overflow-x:hidden
}

.hidden{
  display:none!important
}

.topbar{
  height:108px;
  padding:25px 18px 8px;
  display:grid;
  grid-template-columns:60px 1fr 78px;
  align-items:center
}

.top-refresh{
  border:0;
  background:transparent;
  font-size:37px;
  color:#0789c9;
  line-height:1
}

.top-title{
  text-align:center;
  font-weight:800;
  font-size:24px;
  line-height:1.15;
  color:#111
}

.top-time{
  font-size:23px;
  margin-top:3px
}

.top-group{
  border:0;
  background:transparent;
  font-weight:700;
  font-size:17px;
  color:#111;
  white-space:nowrap
}

.section{
  padding:0 20px 104px
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 2px 9px rgba(31,51,73,.07);
  margin-bottom:12px
}

.login-wrap{
  padding:34px 22px
}

.logo{
  font-size:34px;
  font-weight:900;
  text-align:center;
  color:#0789c9;
  margin:30px 0 26px
}

.logo small{
  display:block;
  font-size:13px;
  color:#6d7784;
  margin-top:5px;
  font-weight:500
}

.input{
  width:100%;
  height:48px;
  border:1px solid #d8e0e8;
  border-radius:12px;
  background:#fff;
  padding:0 14px;
  font-size:16px;
  outline:none;
  margin-bottom:10px
}

.input:focus{
  border-color:#55b9e5;
  box-shadow:0 0 0 3px rgba(85,185,229,.13)
}

.primary{
  width:100%;
  height:48px;
  border:0;
  border-radius:13px;
  background:#0790cf;
  color:#fff;
  font-size:16px;
  font-weight:800;
  margin-top:4px
}

.secondary{
  width:100%;
  height:44px;
  border:1px solid #d7e0e8;
  border-radius:12px;
  background:#fff;
  color:#293444;
  font-weight:700;
  margin-top:8px
}

.checkrow{
  font-size:13px;
  color:#657181;
  margin:5px 0 8px;
  display:flex;
  gap:7px;
  align-items:center
}

.msg{
  text-align:center;
  min-height:21px;
  font-size:13px;
  margin-top:10px;
  color:#e64c4c
}

.welcome{
  text-align:center;
  font-size:19px;
  font-weight:800
}

.subtle{
  text-align:center;
  font-size:13px;
  color:#758091;
  margin-top:6px
}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px
}

.menu-btn{
  min-height:84px;
  border:0;
  border-radius:17px;
  background:#fff;
  box-shadow:0 2px 8px rgba(31,51,73,.06);
  font-size:17px;
  font-weight:800;
  color:#263244
}

.menu-btn span{
  display:block;
  font-size:29px;
  margin-bottom:5px
}

.menu-btn:active,
.nav-btn:active{
  transform:scale(.98)
}

.logout{
  margin-top:12px
}

.page-head{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px
}

.back{
  border:0;
  background:transparent;
  font-size:27px;
  font-weight:800
}

.page-title{
  font-size:21px;
  font-weight:900
}

.head-spacer{
  width:30px
}

.sch-card{
  padding:10px 0 0;
  background:transparent;
  box-shadow:none
}

.sch-nav{
  display:grid;
  grid-template-columns:50px 1fr 50px;
  align-items:center;
  margin-bottom:9px
}

.sch-nav button{
  border:0;
  background:transparent;
  font-size:32px;
  font-weight:700
}

.sch-range{
  text-align:center;
  font-size:19px;
  color:#0789c9;
  font-weight:800
}

.week-head,
.week-row{
  display:grid;
  grid-template-columns:repeat(7,1fr)
}

.week-head{
  border-bottom:1px solid #dbe3eb
}

.week-head div{
  text-align:center;
  padding:9px 1px;
  font-size:15px;
  font-weight:800
}

.week-head .sun,
.day.sun{
  color:#ef4c4c
}

.week-head .sat,
.day.sat{
  color:#0789c9
}

.week-row{
  min-height:68px;
  border-bottom:1px solid #dbe3eb
}

.day{
  position:relative;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-right:1px solid #eef2f5
}

.day:last-child{
  border-right:0
}

.day.today{
  background:#bfe7fa;
  border-radius:14px
}

.day.selected{
  background:#e3e9f0
}

.day .num{
  position:absolute;
  top:5px;
  left:6px;
  font-size:12px;
  color:#334155
}

.day .holiday{
  position:absolute;
  top:5px;
  right:5px;
  font-size:9px;
  color:#ef4c4c
}

.day .work{
  font-size:17px;
  font-weight:900;
  margin-top:6px
}

.work.week{
  color:#d6ad00
}

.work.night,
.work.off{
  color:#0789c9
}

.work.rest,
.work.leave{
  color:#ef4c4c
}

.detail{
  margin-top:12px
}

.detail-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:7px
}

.detail-line{
  font-size:14px;
  color:#596575;
  line-height:1.7
}

.note{
  font-size:12px;
  color:#768292;
  line-height:1.5;
  margin-top:7px
}

.modal-bg{
  position:fixed;
  z-index:1000;
  inset:0;
  background:rgba(15,23,42,.42);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px
}

.modal{
  width:min(390px,100%);
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:19px;
  padding:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.2)
}

.modal h3{
  text-align:center;
  font-size:19px;
  margin-bottom:13px
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px
}

.modal-actions button{
  flex:1;
  height:43px;
  border:0;
  border-radius:11px;
  font-weight:800
}

.ok{
  background:#078fce;
  color:#fff
}

.cancel{
  background:#eef2f6;
  color:#334155
}

.dia-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px
}

.dia-item{
  min-height:52px;
  border:1px solid #d9e2ea;
  border-radius:10px;
  background:#f8fbfd;
  font-size:11px;
  font-weight:800;
  color:#334155
}

.dia-item strong{
  display:block;
  font-size:12px
}

.dia-item.on{
  background:#bfe7fa;
  border-color:#79cbed;
  color:#056d9d
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:10px
}

.status-btn{
  height:42px;
  border:1px solid #dce3e9;
  border-radius:10px;
  background:#fff;
  font-size:12px;
  font-weight:800
}

.status-btn.on{
  background:#ffe1e1;
  border-color:#ff9b9b;
  color:#e33f3f
}

.settings-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:62px;
  padding:0 14px;
  border:0;
  background:#fff;
  border-radius:14px;
  margin-bottom:9px;
  width:100%;
  text-align:left;
  box-shadow:0 2px 7px rgba(31,51,73,.05)
}

.settings-item .left strong{
  display:block;
  font-size:16px
}

.settings-item .left span{
  display:block;
  color:#7b8794;
  font-size:12px;
  margin-top:3px
}

.settings-item b{
  font-size:23px;
  color:#9aa5b1
}

.group-card{
  padding:0;
  overflow:hidden
}

.group-toolbar{
  display:grid;
  grid-template-columns:45px 1fr 45px;
  align-items:center;
  padding:11px 8px 7px
}

.group-toolbar button{
  border:0;
  background:transparent;
  font-size:28px;
  font-weight:800
}

.group-range{
  text-align:center;
  color:#0789c9;
  font-weight:900;
  font-size:18px
}

.group-sync{
  text-align:center;
  font-size:11px;
  color:#7c8795;
  padding-bottom:8px
}

.group-table-wrap{
  overflow-x:auto
}

.group-table{
  width:100%;
  min-width:390px;
  border-collapse:collapse;
  table-layout:fixed
}

.group-table th,
.group-table td{
  height:58px;
  border-bottom:1px solid #dbe3eb;
  text-align:center;
  padding:2px
}

.group-table th{
  height:51px;
  font-size:13px;
  background:#f8fafc
}

.group-table th.name-col,
.group-table td.name-col{
  width:86px;
  text-align:left;
  padding-left:15px;
  font-weight:800
}

.group-table th.today-col,
.group-table td.today-col{
  background:#c7e9f9
}

.group-table td .gwork{
  font-size:17px;
  font-weight:900
}

.gwork.week{
  color:#d2a900
}

.gwork.night,
.gwork.off{
  color:#0789c9
}

.gwork.rest,
.gwork.leave{
  color:#ef4c4c
}

.group-footer{
  display:grid;
  grid-template-columns:86px repeat(7,1fr);
  border-top:3px solid #0789c9
}

.group-footer div{
  text-align:center;
  padding:13px 1px;
  font-size:14px;
  font-weight:900
}

.group-empty{
  padding:45px 15px;
  text-align:center;
  color:#7a8794
}

.pattern-box,
.vacation-box{
  padding:35px 15px;
  text-align:center;
  color:#697686
}

.bottom-nav{
  position:fixed;
  z-index:500;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(430px,100%);
  height:91px;
  background:#f1f5f9;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  align-items:end;
  padding:5px 5px 7px
}

.nav-btn{
  border:0;
  background:transparent;
  color:#394454;
  font-size:11px;
  height:75px;
  border-radius:27px;
  padding:3px 0
}

.nav-btn .ico{
  display:block;
  font-size:28px;
  line-height:36px
}

.nav-btn.active{
  background:#bce8fa
}

.nav-btn span:last-child{
  white-space:nowrap
}

@media(max-width:370px){

  .bottom-nav{
    height:84px
  }

  .nav-btn{
    font-size:10px
  }

  .nav-btn .ico{
    font-size:25px
  }

  .section{
    padding-left:13px;
    padding-right:13px
  }

  .topbar{
    grid-template-columns:45px 1fr 65px;
    padding-left:8px;
    padding-right:8px
  }

  .top-group{
    font-size:14px
  }

  .top-title{
    font-size:21px
  }

  .top-time{
    font-size:20px
  }
}
</style>
</head>

<body>

<div class="container">


<!-- =================================================
     LOGIN
================================================= -->

<div id="login-section">

  <div class="login-wrap">

    <div class="logo">
      🚆 철도비서
      <small>KORAIL 근무관리</small>
    </div>

    <input
      id="login-id"
      class="input"
      inputmode="numeric"
      placeholder="사원번호">

    <input
      id="login-pw"
      class="input"
      type="password"
      placeholder="비밀번호">

    <label class="checkrow">
      <input
        id="remember-login"
        type="checkbox">
      로그인 정보 저장
    </label>

    <button
      class="primary"
      onclick="handleLogin()">
      로그인
    </button>

    <button
      class="secondary"
      onclick="switchSection('signup-section')">
      회원가입
    </button>

    <div
      id="login-msg"
      class="msg">
    </div>

  </div>

</div>


<!-- =================================================
     SIGNUP
================================================= -->

<div
  id="signup-section"
  class="hidden">

  <div class="page-head">

    <button
      class="back"
      onclick="switchSection('login-section')">
      ‹
    </button>

    <div class="page-title">
      회원가입
    </div>

    <div class="head-spacer"></div>

  </div>

  <div class="section">

    <div class="card">

      <input
        id="signup-id"
        class="input"
        inputmode="numeric"
        placeholder="사원번호">

      <input
        id="signup-name"
        class="input"
        placeholder="이름">

      <input
        id="signup-pw"
        class="input"
        type="password"
        placeholder="비밀번호">

      <input
        id="signup-pw2"
        class="input"
        type="password"
        placeholder="비밀번호 확인">

      <button
        class="primary"
        onclick="handleSignup()">
        가입하기
      </button>

      <div
        id="signup-msg"
        class="msg">
      </div>

    </div>

  </div>

</div>


<!-- =================================================
     MAIN
================================================= -->

<div
  id="main-section"
  class="hidden">

  <div class="topbar">

    <button
      class="top-refresh"
      onclick="refreshAll()">
      ↻
    </button>

    <div class="top-title">

      <div id="top-date"></div>

      <div
        id="top-time"
        class="top-time">
      </div>

    </div>

    <button
      class="top-group"
      onclick="openGroup()">
      📍 근무그룹
    </button>

  </div>

  <div class="section">

    <div class="card">

      <div
        id="welcome"
        class="welcome">
      </div>

      <div class="subtle">
        원하는 기능을 선택해주세요.
      </div>

    </div>

    <div class="menu-grid">

      <button
        class="menu-btn"
        onclick="openSchedule()">

        <span>📅</span>
        근무표

      </button>

      <button
        class="menu-btn"
        onclick="openGroup()">

        <span>👥</span>
        근무그룹

      </button>

      <button
        class="menu-btn"
        onclick="openPattern()">

        <span>🔄</span>
        근무패턴

      </button>

      <button
        class="menu-btn"
        onclick="openVacation()">

        <span>🏖️</span>
        휴가관리

      </button>

      <button
        class="menu-btn"
        onclick="openSettings()">

        <span>⚙️</span>
        환경설정

      </button>

      <button
        class="menu-btn"
        onclick="alert('사이트 기능은 다음 업데이트에서 연결됩니다.')">

        <span>🌐</span>
        사이트

      </button>

    </div>

    <button
      class="secondary logout"
      onclick="logout()">
      로그아웃
    </button>

  </div>

</div>


<!-- =================================================
     SCHEDULE
================================================= -->

<div
  id="schedule-section"
  class="hidden">

  <div class="page-head">

    <button
      class="back"
      onclick="switchSection('main-section')">
      ‹
    </button>

    <div class="page-title">
      근무표
    </div>

    <div class="head-spacer"></div>

  </div>

  <div class="section">

    <div class="sch-card">

      <div class="sch-nav">

        <button
          onclick="moveScheduleMonth(-1)">
          ‹
        </button>

        <div
          id="sch-range"
          class="sch-range">
        </div>

        <button
          onclick="moveScheduleMonth(1)">
          ›
        </button>

      </div>

      <div id="calendar"></div>

      <div
        id="day-detail"
        class="card detail">
      </div>

      <div class="note">
        ※ 날짜를 길게 누르면 근무를 직접 변경할 수 있습니다.<br>
        ※ 직접 변경된 근무에는 * 표시가 붙습니다.
      </div>

    </div>

  </div>

</div>


<!-- =================================================
     GROUP
================================================= -->

<div
  id="group-section"
  class="hidden">

  <div class="page-head">

    <button
      class="back"
      onclick="switchSection('main-section')">
      ‹
    </button>

    <div class="page-title">
      근무그룹
    </div>

    <div class="head-spacer"></div>

  </div>

  <div class="section">

    <div class="group-card card">

      <div class="group-toolbar">

        <button
          onclick="moveGroupWeek(-7)">
          ‹
        </button>

        <div
          id="group-range"
          class="group-range">
        </div>

        <button
          onclick="moveGroupWeek(7)">
          ›
        </button>

      </div>

      <div
        id="group-sync"
        class="group-sync">
        서버 연결 중...
      </div>

      <div
        id="group-table-wrap"
        class="group-table-wrap">
      </div>

    </div>

    <div class="note">

      ※ 회원정보 시트에 현재 등록된 회원만 표시됩니다.<br>
      ※ 각 회원의 DIA와 직접 수정한 근무가 서버 기준으로 반영됩니다.

    </div>

  </div>

</div>


<!-- =================================================
     PATTERN
================================================= -->

<div
  id="pattern-section"
  class="hidden">

  <div class="page-head">

    <button
      class="back"
      onclick="switchSection('main-section')">
      ‹
    </button>

    <div class="page-title">
      근무패턴
    </div>

    <div class="head-spacer"></div>

  </div>

  <div class="section">

    <div class="card pattern-box">
      교대제 및 순환 근무 패턴을 설정하는 화면입니다.
    </div>

  </div>

</div>


<!-- =================================================
     VACATION
================================================= -->

<div
  id="vacation-section"
  class="hidden">

  <div class="page-head">

    <button
      class="back"
      onclick="switchSection('main-section')">
      ‹
    </button>

    <div class="page-title">
      휴가관리
    </div>

    <div class="head-spacer"></div>

  </div>

  <div class="section">

    <div class="card vacation-box">
      휴가관리 기능을 준비 중입니다.
    </div>

  </div>

</div>


<!-- =================================================
     SETTINGS
================================================= -->

<div
  id="settings-section"
  class="hidden">

  <div class="page-head">

    <button
      class="back"
      onclick="switchSection('main-section')">
      ‹
    </button>

    <div class="page-title">
      환경설정
    </div>

    <div class="head-spacer"></div>

  </div>

  <div class="section">

    <!--
      ★ 현재 선택된 DIA 표시 카드는 삭제
      ★ 근무설정은 팝업으로 열림
    -->

    <button
      class="settings-item"
      onclick="openDiaSelector()">

      <div class="left">

        <strong>
          근무 설정
        </strong>

        <span>
          오늘의 다이아를 최초 1회 지정
        </span>

      </div>

      <b>
        ›
      </b>

    </button>


    <button
      class="settings-item"
      onclick="alert('출근알람 설정 팝업은 다음 통합 단계에서 연결됩니다.')">

      <div class="left">

        <strong>
          출근알람
        </strong>

        <span>
          출근 알림 및 알람볼륨
        </span>

      </div>

      <b>
        ›
      </b>

    </button>


    <button
      class="settings-item"
      onclick="alert('글꼴크기 설정 팝업은 다음 통합 단계에서 연결됩니다.')">

      <div class="left">

        <strong>
          글꼴크기
        </strong>

        <span>

/* =================================================
   DATE
================================================= */

function todayStr(){

  const d = new Date();

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(2,'0') +
    '-' +
    String(
      d.getDate()
    ).padStart(2,'0')
  );
}


function parseDate(s){

  const p =
    s.split('-').map(Number);

  return new Date(
    p[0],
    p[1]-1,
    p[2]
  );
}


function dateStr(d){

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(2,'0') +
    '-' +
    String(
      d.getDate()
    ).padStart(2,'0')
  );
}


function addDays(s,n){

  const d =
    parseDate(s);

  d.setDate(
    d.getDate()+n
  );

  return dateStr(d);
}


function diffDays(a,b){

  return Math.round(
    (
      parseDate(b) -
      parseDate(a)
    ) / 86400000
  );
}


function esc(v){

  return String(
    v == null ? '' : v
  ).replace(
    /[&<>"']/g,
    function(m){

      return {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[m];
    }
  );
}


/* =================================================
   JSONP
================================================= */

function jsonp(
  action,
  params={},
  timeout=15000
){

  return new Promise(
    function(resolve,reject){

      const cb =
        'railwayCb_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random()*100000
        );

      const script =
        document.createElement(
          'script'
        );

      let done=false;

      const timer =
        setTimeout(
          function(){

            finish(
              new Error(
                '서버 응답 시간 초과'
              )
            );

          },
          timeout
        );

      function finish(
        err,
        data
      ){

        if(done)return;

        done=true;

        clearTimeout(timer);

        try{

          delete window[cb];

        }catch(e){

          window[cb]=undefined;
        }

        script.remove();

        if(err){

          reject(err);

        }else{

          resolve(data);
        }
      }

      window[cb] =
        function(data){

          finish(
            null,
            data
          );
        };

      const q =
        new URLSearchParams({

          ...params,

          action,

          callback:cb,

          _t:Date.now()
        });

      script.src =
        GAS_URL +
        '?' +
        q.toString();

      script.onerror =
        function(){

          finish(
            new Error(
              '서버 연결에 실패했습니다.'
            )
          );
        };

      document.body.appendChild(
        script
      );
    }
  );
}

  const k =
    m + '-' + d;

  if(fixed[k]){
    return fixed[k];
  }

  const x = {

    '2026-2-16':'설날',

    '2026-2-17':'설날',

    '2026-2-18':'설날',

    '2026-3-2':'대체',

    '2026-5-24':'석가탄신일',

    '2026-5-25':'대체',

    '2026-6-3':'선거일',

    '2026-8-17':'대체',

    '2026-9-24':'추석',

    '2026-9-25':'추석',

    '2026-9-26':'추석',

    '2026-10-5':'대체'
  };

  return (
    x[
      y +
      '-' +
      m +
      '-' +
      d
    ] ||
    ''
  );
}


/* =================================================
   PATTERN
================================================= */

function getDiaBySeq(seq){

  return diaData.find(
    function(x){

      return (
        String(x.seq) ===
        String(seq)
      );
    }
  );
}


function getPatternDia(
  y,
  m,
  d
){

  if(
    !selectedDia ||
    !selectedDia.seq ||
    !selectedDia.anchor ||
    !diaData.length
  ){

    return null;
  }

  const idx =
    diaData.findIndex(
      function(x){

        return (
          String(x.seq) ===
          String(
            selectedDia.seq
          )
        );
      }
    );

  if(idx < 0){
    return null;
  }

  const diff =
    diffDays(
      selectedDia.anchor,

      y +
      '-' +
      String(m)
        .padStart(2,'0') +
      '-' +
      String(d)
        .padStart(2,'0')
    );

  const i =
    (
      (
        idx +
        diff
      ) %
      diaData.length +
      diaData.length
    ) %
    diaData.length;

  return diaData[i];
}


/* =================================================
   LOCAL OVERRIDE
================================================= */

function localOverrideKey(){

  return (
    OVERRIDE_LOCAL_PREFIX +
    (
      currentUser
        ? currentUser.employeeId
        : 'guest'
    )
  );
}


function getLocalOverrides(){

  try{

    return JSON.parse(
      lsGet(
        localOverrideKey()
      ) || '{}'
    ) || {};

  }catch(e){

    return {};
  }
}


function setLocalOverrides(o){

  lsSet(
    localOverrideKey(),
    JSON.stringify(o)
  );
}


function finalLocalDay(
  y,
  m,
  d
){

  const ds =
    y +
    '-' +
    String(m).padStart(2,'0') +
    '-' +
    String(d).padStart(2,'0');

  const ov =
    getLocalOverrides()[ds];

  if(ov){

    if(
      ov.type ===
      'status'
    ){

      return {

        dia:'',

        type:
          ov.status,

        start:'',

        end:'',

        train1:'',

        train2:'',

        manual:true,

        status:
          ov.status
      };
    }

    const item =
      diaData.find(
        function(x){

          return (
            String(x.dia) ===
            String(ov.dia)
          );
        }
      );

    return {

      ...(item || {

        dia:
          ov.dia,

        type:'',

        start:'',

        end:'',

        train1:'',

        train2:''
      }),

      manual:true
    };
  }

  return getPatternDia(
    y,
    m,
    d
  );
}


/* =================================================
   WORK STYLE
================================================= */

function workClass(type){

  if(
    type === '주간'
  ){
    return 'week';
  }

  if(
    type === '야간'
  ){
    return 'night';
  }

  if(
    [
      '휴무',
      '연차',
      '육아휴직',
      '돌봄',
      '출산휴가',
      '병가',
      '공가'
    ].includes(type)
  ){

    return 'rest';
  }

  return 'off';
}


function shortWork(type){

  const map = {

    '주간':'주',

    '야간':'야',

    '휴무':'휴',

    '연차':'휴',

    '육아휴직':'휴',

    '돌봄':'휴',

    '출산휴가':'휴',

    '병가':'휴',

    '공가':'휴',

    '비번':'비'
  };

  return (
    map[type] ||
    type ||
    ''
  );
}


/* =================================================
   CALENDAR
================================================= */

function renderCalendar(){

  const first =
    new Date(
      calendarYear,
      calendarMonth-1,
      1
    );

  const last =
    new Date(
      calendarYear,
      calendarMonth,
      0
    );

  const start =
    first.getDay();

  const days =
    last.getDate();

  const today =
    todayStr();

  document
    .getElementById(
      'sch-range'
    )
    .textContent =
      calendarYear +
      '. ' +
      String(
        calendarMonth
      ).padStart(2,'0');

  let html =
    '<div class="week-head">' +
    DAY_NAMES
      .map(
        function(n,i){

          return `
          <div class="${
            i===0
              ? 'sun'
              : i===6
                ? 'sat'
                : ''
          }">
            ${n}
          </div>
          `;
        }
      )
      .join('') +
    '</div>';

  let day=1;

  for(
    let r=0;
    r<6;
    r++
  ){

    let row =
      '<div class="week-row">';

    for(
      let c=0;
      c<7;
      c++
    ){

      if(
        (
          r===0 &&
          c<start
        ) ||
        day>days
      ){

        row +=
          '<div class="day"></div>';

        continue;
      }

      const ds =
        dateStr(
          new Date(
            calendarYear,
            calendarMonth-1,
            day
          )
        );

      const h =
        holidayName(
          calendarYear,
          calendarMonth,
          day
        );

      const dow =
        new Date(
          calendarYear,
          calendarMonth-1,
          day
        ).getDay();

      const item =
        finalLocalDay(
          calendarYear,
          calendarMonth,
          day
        );

      const cls =
        [
          'day',

          ds===today
            ? 'today'
            : '',

          selectedDate &&
          selectedDate.y===calendarYear &&
          selectedDate.m===calendarMonth &&
          selectedDate.d===day
            ? 'selected'
            : '',

          dow===0
            ? 'sun'
            : dow===6
              ? 'sat'
              : ''

        ]
        .filter(Boolean)
        .join(' ');

      const label =
        item
          ? (
              item.manual
                ? '*'
                : ''
            ) +
            shortWork(
              item.type
            )
          : '';

      row += `

        <div
          class="${cls}"
          data-date="${ds}"

          onmousedown="
            lpStart(event,'${ds}')
          "

          ontouchstart="
            lpStart(event,'${ds}')
          "

          onmouseup="
            lpEnd(event,'${ds}')
          "

          ontouchend="
            lpEnd(event,'${ds}')
          "

          onclick="
            calendarClick('${ds}')
          ">

          <span class="num">
            ${day}
          </span>

          ${
            h
              ? `
                <span class="holiday">
                  ${h}
                </span>
              `
              : ''
          }

          <span
            class="work ${
              workClass(
                item &&
                item.type
              )
            }">

            ${esc(label)}

          </span>

        </div>
      `;

      day++;
    }

    row +=
      '</div>';

    html +=
      row;

    if(day>days){
      break;
    }
  }

  document
    .getElementById(
      'calendar'
    )
    .innerHTML =
    html;

  renderDayDetail();
}


let lpTimer=null;

let lpStartX=0;

let lpStartY=0;

let longDate='';


function lpStart(
  e,
  ds
){

  const p =
    e.touches
      ? e.touches[0]
      : e;

  lpStartX =
    p.clientX;

  lpStartY =
    p.clientY;

  longDate =
    ds;

  clearTimeout(
    lpTimer
  );

  lpTimer =
    setTimeout(
      function(){

        openScheduleEdit(
          ds
        );

        lpTimer=null;

      },
      900
    );
}


function lpEnd(){

  clearTimeout(
    lpTimer
  );

  lpTimer=null;
}


function calendarClick(ds){

  if(
    lpTimer===null &&
    longDate===ds
  ){

    return;
  }

  const d =
    parseDate(ds);

  selectedDate = {

    y:
      d.getFullYear(),

    m:
      d.getMonth()+1,

    d:
      d.getDate()
  };

  renderCalendar();
}


function moveScheduleMonth(n){

  const d =
    new Date(
      calendarYear,
      calendarMonth-1+n,
      1
    );

  calendarYear =
    d.getFullYear();

  calendarMonth =
    d.getMonth()+1;

  selectedDate =
    null;

  renderCalendar();
}

================================================= */

async function saveScheduleEdit(){

  const dia =
    document
      .getElementById(
        'edit-dia'
      )
      .value
      .trim();

  let type='';

  let status='';

  if(dia){

    type='dia';

  }else if(
    selectedEditStatus
  ){

    type='status';

    status =
      selectedEditStatus;

  }else{

    alert(
      'DIA 또는 근무 상태를 선택해주세요.'
    );

    return;
  }

  /*
   * 로컬 즉시 반영
   */

  const ovs =
    getLocalOverrides();

  ovs[editDate] = {

    type,
    dia,
    status,

    updatedAt:
      new Date()
        .toISOString()
  };

  setLocalOverrides(
    ovs
  );

  /*
   * ★ 서버에도 저장
   */

  try{

    const r =
      await jsonp(
        'saveScheduleOverride',
        {

          employeeId:
            currentUser.employeeId,

          token:
            currentUser.token,

          date:
            editDate,

          type,
          dia,
          status

        },
        15000
      );

    if(!r.success){

      alert(
        r.message ||
        '서버 저장에 실패했습니다.'
      );

      return;
    }

  }catch(e){

    alert(
      '서버 저장에 실패했습니다. 인터넷 연결을 확인해주세요.'
    );

    return;
  }

  closeModal(
    'edit-modal'
  );

  renderCalendar();

  /*
   * 근무그룹에도 즉시 반영
   */

  if(
    !document
      .getElementById(
        'group-section'
      )
      .classList
      .contains('hidden')
  ){

    loadGroupSchedule();
  }
}

    );

/* =================================================
   GROUP SERVER LOAD
================================================= */

async function loadGroupSchedule(){

  if(
    !currentUser ||
    syncBusy
  ){
    return;
  }

  syncBusy=true;

  const end =
    addDays(
      groupStartDate,
      6
    );

  const startDateObj =
    parseDate(
      groupStartDate
    );

  const endDateObj =
    parseDate(
      end
    );

  document
    .getElementById(
      'group-range'
    )
    .textContent =
      (
        startDateObj.getMonth()+1
      ) +
      '. ' +
      startDateObj.getDate() +
      ' ~ ' +
      (
        endDateObj.getMonth()+1
      ) +
      '. ' +
      endDateObj.getDate();

  try{

    /*
     * ★ 핵심 서버 요청
     *
     * Apps Script가 매번
     * 회원정보 시트를 읽기 때문에
     * 현재 실제 가입된 회원만 반환
     */

    const r =
      await jsonp(
        'getGroupSchedule',
        {

          employeeId:
            currentUser.employeeId,

          token:
            currentUser.token,

          startDate:
            groupStartDate,

          endDate:
            end

        },
        15000
      );

    if(!r.success){

      document
        .getElementById(
          'group-sync'
        )
        .textContent =
          r.message ||
          '근무그룹 조회 실패';

      return;
    }

    renderGroupTable(
      r
    );

    document
      .getElementById(
        'group-sync'
      )
      .textContent =
        '마지막 동기화 ' +
        r.serverTime +
        ' · 15초마다 자동 갱신';

  }catch(e){

    document
      .getElementById(
        'group-sync'
      )
      .textContent =
        '서버 연결 실패 · ' +
        e.message;

  }finally{

    syncBusy=false;
  }
}


/* =================================================
   GROUP TABLE
================================================= */

function renderGroupTable(
  data
){

  const dates =
    groupDates();

  const today =
    todayStr();

  /*
   * 회원이 한 명도 없을 경우
   */

  if(
    !data.members ||
    !data.members.length
  ){

    document
      .getElementById(
        'group-table-wrap'
      )
      .innerHTML =
        '<div class="group-empty">현재 회원정보에 등록된 회원이 없습니다.</div>';

    return;
  }

  let html =
    '<table class="group-table">' +
    '<thead>' +
    '<tr>' +
    '<th class="name-col">회원</th>';

  dates.forEach(
    function(ds){

      const d =
        parseDate(ds);

      const dow =
        d.getDay();

      const cls =
        ds === today
          ? 'today-col'
          : '';

      html += `

        <th class="${cls}">

          ${DAY_NAMES[dow]}

          <br>

          ${d.getDate()}

        </th>

      `;
    }
  );

  html +=
    '</tr>' +
    '</thead>' +
    '<tbody>';


  /*
   * ★ 서버가 반환한 members만 표시
   *
   * 이름/사원번호를
   * HTML에서 직접 지정하지 않음
   */

  data.members.forEach(
    function(m){

      html += `

        <tr>

          <td class="name-col">

            ${esc(
              m.name
            )}

          </td>

      `;

      dates.forEach(
        function(ds){

          const x =
            (
              m.days &&
              m.days[ds]
            ) || {};

          const cls =
            ds === today
              ? 'today-col'
              : '';

          const workType =
            x.status ||
            x.type ||
            '';

          const label =
            x.manual
              ? '*' +
                shortWork(
                  workType
                )
              :
                shortWork(
                  workType
                );

          html += `

            <td
              class="${cls}"
              title="${esc(
                x.dia ||
                x.type ||
                ''
              )}">

              <span
                class="gwork ${
                  workClass(
                    workType
                  )
                }">

                ${esc(
                  label
                )}

              </span>

            </td>

          `;
        }
      );

      html +=
        '</tr>';
    }
  );

  html +=
    '</tbody>' +
    '</table>';


  /*
   * 날짜별 휴무/휴가 인원
   */

  let foot =
    '<div class="group-footer">' +
    '<div>휴무</div>';

  dates.forEach(
    function(ds){

      let n=0;

      data.members.forEach(
        function(m){

          const x =
            m.days &&
            m.days[ds];

          if(
            x &&
            [
              '휴무',
              '연차',
              '육아휴직',
              '돌봄',
              '출산휴가',
              '병가',
              '공가'
            ].includes(
              x.status ||
              x.type
            )
          ){

            n++;
          }
        }
      );

      foot +=
        '<div>' +
        n +
        '명</div>';
    }
  );

  foot +=
    '</div>';


  document
    .getElementById(
      'group-table-wrap'
    )
    .innerHTML =
      html +
      foot;
}

  if(
    !document
      .getElementById(
        'group-section'
      )
      .classList
      .contains('hidden')
  ){

    loadGroupSchedule();
  }
}


/* =================================================
   ERROR
================================================= */

window.addEventListener(
  'error',
  function(e){

    const m =
      document
        .getElementById(
          'login-msg'
        );

    if(m){

      m.textContent =
        '스크립트 오류: ' +
        e.message;
    }
  }
);


/* =================================================
   INIT
================================================= */

async function init(){

  loadDiaCache();

  const u =
    loadUserFromStorage();

  if(u){

    currentUser =
      u;

    document
      .getElementById(
        'welcome'
      )
      .textContent =
        u.name +
        '님';

    await checkSavedLogin();

  }else{

    switchSection(
      'login-section'
    );
  }
}


init();

</script>

</body>
</html>
