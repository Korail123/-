<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>철도비서</title>

<style>
:root {
  --primary: #0284c7;
  --primary-light: #e0f2fe;
  --primary-dark: #0369a1;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-sub: #64748b;
  --border: #e2e8f0;
  --red: #ef4444;
  --yellow: #f59e0b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text-main);
}

body {
  display: flex;
  justify-content: center;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

.container {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,0.05);
}

.hidden {
  display: none !important;
}

/* Top Bar */
.topbar {
  height: 72px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.top-refresh {
  font-size: 24px;
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  transition: background 0.2s;
}
.top-refresh:active {
  background: var(--primary-light);
}

.top-title {
  text-align: center;
  font-weight: 700;
  font-size: 16px;
  color: var(--text-main);
}

.top-time {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 1px;
}

.top-group {
  background: var(--primary-light);
  color: var(--primary-dark);
  font-weight: 700;
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 20px;
}

/* Sections & Cards */
.section {
  padding: 20px 20px 110px;
}

.card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

/* Login / Signup */
.login-wrap {
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 100vh;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  color: var(--primary);
  margin-bottom: 36px;
}

.logo small {
  display: block;
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 6px;
  font-weight: 500;
  letter-spacing: -0.5px;
}

.input {
  width: 100%;
  height: 52px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card-bg);
  padding: 0 16px;
  font-size: 15px;
  outline: none;
  margin-bottom: 12px;
  color: var(--text-main);
  transition: all 0.2s;
}

.input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
}

.primary {
  width: 100%;
  height: 52px;
  border-radius: 14px;
  background: var(--primary);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  margin-top: 6px;
  transition: background 0.2s;
}
.primary:active {
  background: var(--primary-dark);
}

.secondary {
  width: 100%;
  height: 48px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card-bg);
  color: var(--text-main);
  font-weight: 600;
  margin-top: 10px;
  font-size: 15px;
}

.checkrow {
  font-size: 14px;
  color: var(--text-sub);
  margin: 4px 0 16px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.msg {
  text-align: center;
  min-height: 24px;
  font-size: 13px;
  margin-top: 12px;
  color: var(--red);
  font-weight: 500;
}

.welcome {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}

.subtle {
  text-align: center;
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 6px;
}

/* Menu Grid */
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}

.menu-btn {
  min-height: 96px;
  border-radius: 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.02);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, background 0.2s;
}

.menu-btn span {
  font-size: 28px;
  margin-bottom: 8px;
}

.menu-btn:active, .nav-btn:active {
  transform: scale(0.97);
  background: var(--bg);
}

.logout {
  margin-top: 16px;
  color: var(--red);
  border-color: #fee2e2;
  background: #fef2f2;
}

/* Page Headers */
.page-head {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
}

.back {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-title {
  font-size: 18px;
  font-weight: 700;
}

.head-spacer {
  width: 36px;
}

/* Calendar Schedule */
.sch-card {
  padding: 0;
  background: transparent;
  box-shadow: none;
  border: none;
}

.sch-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 0 4px;
}

.sch-nav button {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-main);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.sch-range {
  font-size: 17px;
  color: var(--text-main);
  font-weight: 700;
}

.week-head, .week-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.week-head {
  background: var(--card-bg);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  border: 1px solid var(--border);
  border-bottom: none;
}

.week-head div {
  text-align: center;
  padding: 12px 0;
  font-size: 13px;
  font-weight: 700;
}

.week-head .sun, .day.sun { color: var(--red); }
.week-head .sat, .day.sat { color: var(--primary); }

.week-row {
  min-height: 72px;
  background: var(--card-bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.week-row:last-child {
  border-bottom-left-radius: 16px;
  border-bottom-right-radius: 16px;
}

.day {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  padding-top: 14px;
}

.day:last-child {
  border-right: none;
}

.day.today {
  background: var(--primary-light);
}

.day.selected {
  background: #f1f5f9;
}

.day .num {
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 11px;
  color: var(--text-sub);
  font-weight: 600;
}

.day .holiday {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 9px;
  color: var(--red);
}

.day .work {
  font-size: 15px;
  font-weight: 800;
  margin-top: 4px;
}

.work.week { color: var(--yellow); }
.work.night, .work.off { color: var(--primary); }
.work.rest, .work.leave { color: var(--red); }

.detail {
  margin-top: 16px;
}

.detail-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
}

.detail-line {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.6;
}

.note {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.5;
  margin-top: 12px;
  padding: 0 4px;
}

/* Modals */
.modal-bg {
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  width: 100%;
  max-width: 380px;
  max-height: 85vh;
  overflow: auto;
  background: var(--card-bg);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

.modal h3 {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.modal-actions button {
  flex: 1;
  height: 46px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
}

.ok {
  background: var(--primary);
  color: #fff;
}

.cancel {
  background: var(--bg);
  color: var(--text-sub);
  border: 1px solid var(--border);
}

.dia-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}

.dia-item {
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.dia-item strong {
  font-size: 12px;
}

.dia-item.on {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary-dark);
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.status-btn {
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card-bg);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-main);
}

.status-btn.on {
  background: #fef2f2;
  border-color: #fecaca;
  color: var(--red);
}

/* Settings Items */
.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 64px;
  padding: 0 18px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 10px;
  width: 100%;
  text-align: left;
  box-shadow: 0 2px 4px rgba(15, 23, 42, 0.02);
}

.settings-item .left strong {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
}

.settings-item .left span {
  display: block;
  color: var(--text-sub);
  font-size: 12px;
  margin-top: 2px;
}

.settings-item b {
  font-size: 20px;
  color: var(--text-sub);
}

/* Group & Tables */
.group-card {
  padding: 0;
  overflow: hidden;
}

.group-toolbar {
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  padding: 12px 8px 6px;
}

.group-toolbar button {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
}

.group-range {
  text-align: center;
  color: var(--text-main);
  font-weight: 700;
  font-size: 16px;
}

.group-sync {
  text-align: center;
  font-size: 12px;
  color: var(--text-sub);
  padding-bottom: 10px;
}

.group-table-wrap {
  overflow-x: auto;
}

.group-table {
  width: 100%;
  min-width: 390px;
  border-collapse: collapse;
  table-layout: fixed;
}

.group-table th, .group-table td {
  height: 54px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  padding: 2px;
}

.group-table th {
  height: 44px;
  font-size: 12px;
  background: var(--bg);
  color: var(--text-sub);
  font-weight: 700;
}

.group-table th.name-col, .group-table td.name-col {
  width: 80px;
  text-align: left;
  padding-left: 14px;
  font-weight: 700;
}

.group-table th.today-col, .group-table td.today-col {
  background: var(--primary-light);
}

.group-table td .gwork {
  font-size: 16px;
  font-weight: 800;
}

.group-footer {
  display: grid;
