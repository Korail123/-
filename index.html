```html
<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>철도비서</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans KR",
                "Malgun Gothic",
                sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }


        body {
            min-height: 100vh;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            background: #ffffff;
        }


        /****************************************
         * 상단
         ****************************************/

        .top-header {
            padding: 24px 20px 14px;
            background: #ffffff;
            text-align: center;
        }


        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #1976d2;
            letter-spacing: -1px;
        }


        .subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: #8b95a5;
        }


        .clock {
            margin-top: 14px;
            padding: 10px;
            border-radius: 12px;
            background: #f3f7fc;
            color: #3975a8;
            font-size: 14px;
            font-weight: 700;
        }


        /****************************************
         * 공통 화면
         ****************************************/

        .page {
            display: none;
            padding: 12px 18px 30px;
        }


        .page.active {
            display: block;
        }


        /****************************************
         * 로그인
         ****************************************/

        .login-card {
            margin-top: 12px;
            padding: 24px 20px;
            border: 1px solid #e6edf5;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 8px 25px rgba(30, 60, 90, 0.08);
        }


        .login-title {
            text-align: center;
            font-size: 23px;
            font-weight: 900;
            color: #26384a;
        }


        .login-description {
            margin-top: 8px;
            margin-bottom: 22px;
            text-align: center;
            font-size: 13px;
            color: #929baa;
        }


        .input-label {
            display: block;
            margin: 0 0 7px;
            font-size: 13px;
            font-weight: 800;
            color: #526172;
        }


        .input-box {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            padding: 0 14px;
            border: 1px solid #dce4ed;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: #fafcff;
        }


        .input-box:focus {
            border-color: #64a9e8;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(100, 169, 232, 0.12);
        }


        .primary-button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 12px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            font-weight: 900;
        }


        .primary-button:active {
            transform: scale(0.98);
        }


        .secondary-button {
            width: 100%;
            height: 48px;
            margin-top: 10px;
            border: 1px solid #dce4ed;
            border-radius: 12px;
            background: #ffffff;
            color: #526172;
            font-size: 15px;
            font-weight: 800;
        }


        .message {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }


        .message.show {
            display: block;
        }


        .message.success {
            background: #edf9f1;
            color: #208443;
        }


        .message.error {
            background: #fff1f1;
            color: #d14343;
        }


        /****************************************
         * 로그인 성공
         ****************************************/

        .login-success-card {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3px;
            margin: 6px 0 18px;
            padding: 15px 12px;
            border: 1px solid #d9eaf8;
            border-radius: 14px;
            background: #f5faff;
            color: #425466;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }


        .login-success-check {
            color: #63b8ff;
            font-size: 19px;
            font-weight: 900;
        }


        .login-success-name {
            color: #1976d2;
            font-weight: 900;
        }


        .bracket {
            color: #91a1b2;
        }


        /****************************************
         * 메인 메뉴
         ****************************************/

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px;
        }


        .menu-button {
            min-height: 92px;
            padding: 15px 10px;
            border: 1px solid #e3eaf2;
            border-radius: 17px;
            background: #ffffff;
            box-shadow: 0 5px 16px rgba(30, 60, 90, 0.05);
            text-align: center;
        }


        .menu-button:active {
            transform: scale(0.98);
        }


        .menu-icon {
            display: block;
            margin-bottom: 8px;
            font-size: 27px;
        }


        .menu-title {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 900;
        }


        .menu-description {
            display: block;
            margin-top: 4px;
            color: #98a2b1;
            font-size: 10px;
        }


        /****************************************
         * 달력
         ****************************************/

        .calendar-card {
            margin-top: 18px;
            padding: 16px 12px;
            border: 1px solid #e4ebf3;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 5px 18px rgba(30, 60, 90, 0.05);
        }


        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }


        .calendar-title {
            font-size: 20px;
            font-weight: 900;
            color: #26384a;
        }


        .calendar-arrow {
            width: 40px;
            height: 36px;
            border: 0;
            border-radius: 10px;
            background: #f1f5f9;
            color: #526172;
            font-size: 18px;
            font-weight: 900;
        }


        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 5px;
        }


        .week-day {
            padding: 7px 0;
            text-align: center;
            color: #7c8796;
            font-size: 11px;
            font-weight: 900;
        }


        .week-day.sunday {
            color: #e15b5b;
        }


        .week-day.saturday {
            color: #3975c8;
        }


        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }


        .calendar-day {
            min-height: 65px;
            padding: 5px 3px;
            border-radius: 9px;
            background: #fafcff;
            text-align: center;
            overflow: hidden;
        }


        .calendar-day.today {
            border: 2px solid #63b8ff;
            background: #f2f9ff;
        }


        .day-number {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
        }


        .calendar-day.sunday .day-number {
            color: #df5c5c;
        }


        .calendar-day.saturday .day-number {
            color: #3975c8;
        }


        .dia-badge {
            display: block;
            margin-top: 5px;
            padding: 4px 2px;
            border-radius: 6px;
            background: #e9f4ff;
            color: #2471b8;
            font-size: 9px;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .empty-day {
            min-height: 65px;
        }


        /****************************************
         * 페이지 제목
         ****************************************/

        .section-title {
            margin: 8px 0 15px;
            font-size: 22px;
            font-weight: 900;
            color: #26384a;
        }


        .back-button {
            width: 100%;
            height: 46px;
            margin-top: 16px;
            border: 1px solid #dce4ed;
            border-radius: 12px;
            background: white;
            color: #526172;
            font-size: 14px;
            font-weight: 800;
        }


        /****************************************
         * 설정
         ****************************************/

        .settings-card {
            padding: 16px;
            border: 1px solid #e4ebf3;
            border-radius: 16px;
            background: white;
        }


        .settings-button {
            width: 100%;
            min-height: 70px;
            margin-bottom: 10px;
            padding: 13px 15px;
            border: 1px solid #e1e8f0;
            border-radius: 14px;
            background: #ffffff;
            text-align: left;
        }


        .settings-button-title {
            display: block;
            color: #334155;
            font-size: 15px;
            font-weight: 900;
        }


        .settings-button-description {
            display: block;
            margin-top: 5px;
            color: #98a2b1;
            font-size: 11px;
        }


        /****************************************
         * DIA 모달
         ****************************************/

        .modal {
            position: fixed;
            z-index: 9999;
            inset: 0;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            background: rgba(15, 23, 42, 0.45);
        }


        .modal.show {
            display: flex;
        }


        .dia-modal {
            width: 100%;
            max-width: 520px;
            max-height: 88vh;
            overflow: hidden;
            border-radius: 22px 22px 0 0;
            background: #ffffff;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
        }


        .dia-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px;
            border-bottom: 1px solid #edf1f5;
        }


        .dia-modal-title {
            font-size: 19px;
            font-weight: 900;
            color: #26384a;
        }


        .close-button {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: #f1f5f9;
            color: #526172;
            font-size: 20px;
        }


        .dia-modal-content {
            max-height: calc(88vh - 150px);
            overflow-y: auto;
            padding: 15px 18px;
        }


        .dia-description {
            margin: 0 0 14px;
            color: #7d8998;
            font-size: 12px;
            line-height: 1.5;
        }


        .dia-selected-info {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #f3f8fd;
            color: #3975a8;
            font-size: 12px;
            font-weight: 800;
        }


        .dia-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }


        .dia-item {
            position: relative;
        }


        .dia-checkbox {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }


        .dia-label {
            display: block;
            min-height: 65px;
            padding: 10px;
            border: 1px solid #e1e8f0;
            border-radius: 12px;
            background: #ffffff;
        }


        .dia-checkbox:checked + .dia-label {
            border-color: #63b8ff;
            background: #f1f9ff;
            box-shadow: 0 0 0 2px rgba(99, 184, 255, 0.12);
        }


        .dia-code {
            display: block;
            color: #1976d2;
            font-size: 14px;
            font-weight: 900;
        }


        .dia-name {
            display: block;
            margin-top: 3px;
            color: #657385;
            font-size: 10px;
        }


        .dia-time {
            display: block;
            margin-top: 4px;
            color: #99a4b1;
            font-size: 9px;
        }


        .dia-modal-footer {
            display: flex;
            gap: 9px;
            padding: 14px 18px 18px;
            border-top: 1px solid #edf1f5;
            background: white;
        }


        .modal-cancel {
            flex: 1;
            height: 48px;
            border: 1px solid #dce4ed;
            border-radius: 12px;
            background: white;
            color: #526172;
            font-weight: 800;
        }


        .modal-save {
            flex: 2;
            height: 48px;
            border: 0;
            border-radius: 12px;
            background: #1976d2;
            color: white;
            font-weight: 900;
        }


        /****************************************
         * 로딩
         ****************************************/

        .loading {
            padding: 30px 10px;
            color: #8b95a5;
            font-size: 13px;
            text-align: center;
        }


        /****************************************
         * PC
         ****************************************/

        @media (min-width: 700px) {

            body {
                padding: 25px 0;
            }

            .app {
                min-height: calc(100vh - 50px);
                border-radius: 25px;
                overflow: hidden;
                box-shadow: 0 10px 40px rgba(30, 60, 90, 0.12);
            }

            .modal {
                align-items: center;
            }

            .dia-modal {
                border-radius: 22px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =======================================
         상단
         ======================================= -->

    <header class="top-header">

        <div class="logo">
            🚆 철도비서
        </div>

        <div class="subtitle">
            KORAIL 나만의 철도비서
        </div>

        <div
            id="clock"
            class="clock"
        >
            현재시간
        </div>

    </header>


    <!-- =======================================
         로그인 페이지
         ======================================= -->

    <section
        id="login-section"
        class="page active"
    >

        <div class="login-card">

            <div class="login-title">
                로그인
            </div>

            <div class="login-description">
                철도비서를 이용하려면 로그인해주세요.
            </div>


            <label class="input-label">
                사원번호
            </label>

            <input
                id="login-employee-id"
                class="input-box"
                type="text"
                inputmode="numeric"
                placeholder="사원번호를 입력하세요"
                autocomplete="username"
            >


            <label class="input-label">
                비밀번호
            </label>

            <input
                id="login-password"
                class="input-box"
                type="password"
                placeholder="비밀번호를 입력하세요"
                autocomplete="current-password"
                onkeydown="if(event.key === 'Enter') loginUser();"
            >


            <button
                class="primary-button"
                onclick="loginUser()"
            >
                로그인
            </button>


            <button
                class="secondary-button"
                onclick="showSignup()"
            >
                회원가입
            </button>


            <div
                id="login-message"
                class="message"
            ></div>

        </div>

    </section>


    <!-- =======================================
         회원가입
         ======================================= -->

    <section
        id="signup-section"
        class="page"
    >

        <div class="login-card">

            <div class="login-title">
                회원가입
            </div>

            <div class="login-description">
                철도비서 계정을 만들어주세요.
            </div>


            <label class="input-label">
                사원번호
            </label>

            <input
                id="signup-employee-id"
                class="input-box"
                type="text"
                inputmode="numeric"
                placeholder="사원번호"
            >


            <label class="input-label">
                이름
            </label>

            <input
                id="signup-name"
                class="input-box"
                type="text"
                placeholder="이름"
            >


            <label class="input-label">
                비밀번호
            </label>

            <input
                id="signup-password"
                class="input-box"
                type="password"
                placeholder="비밀번호 4자리 이상"
            >


            <button
                class="primary-button"
                onclick="signupUser()"
            >
                회원가입
            </button>


            <button
                class="secondary-button"
                onclick="showLogin()"
            >
                로그인으로 돌아가기
            </button>


            <div
                id="signup-message"
                class="message"
            ></div>

        </div>

    </section>


    <!-- =======================================
         메인
         ======================================= -->

    <section
        id="main-section"
        class="page"
    >

        <div class="login-success-card">

            <span class="bracket">
                [
            </span>

            <span class="login-success-check">
                ✔
            </span>

            <span
                id="welcome-name"
                class="login-success-name"
            >
                송주영
            </span>

            <span>
                님 로그인 되었습니다.
            </span>

            <span class="bracket">
                ]
            </span>

        </div>


        <div class="menu-grid">


            <button
                class="menu-button"
                onclick="openSchedule()"
            >

                <span class="menu-icon">
                    📅
                </span>

                <span class="menu-title">
                    근무표
                </span>

                <span class="menu-description">
                    월간 근무표
                </span>

            </button>


            <button
                class="menu-button"
                onclick="showSimplePage('근무그룹')"
            >

                <span class="menu-icon">
                    👥
                </span>

                <span class="menu-title">
                    근무그룹
                </span>

                <span class="menu-description">
                    근무그룹 관리
                </span>

            </button>


            <button
                class="menu-button"
                onclick="showSimplePage('근무패턴')"
            >

                <span class="menu-icon">
                    🔄
                </span>

                <span class="menu-title">
                    근무패턴
                </span>

                <span class="menu-description">
                    반복 패턴
                </span>

            </button>


            <button
                class="menu-button"
                onclick="showSimplePage('휴가관리')"
            >

                <span class="menu-icon">
                    🌴
                </span>

                <span class="menu-title">
                    휴가관리
                </span>

                <span class="menu-description">
                    휴가 및 연차
                </span>

            </button>


            <button
                class="menu-button"
                onclick="openSettings()"
            >

                <span class="menu-icon">
                    ⚙️
                </span>

                <span class="menu-title">
                    환경설정
                </span>

                <span class="menu-description">
                    앱 설정
                </span>

            </button>


        </div>


        <!-- 달력 -->

        <div class="calendar-card">

            <div class="calendar-header">

                <button
                    class="calendar-arrow"
                    onclick="previousMonth()"
                >
                    ‹
                </button>


                <div
                    id="calendar-title"
                    class="calendar-title"
                >
                    2026년 10월
                </div>


                <button
                    class="calendar-arrow"
                    onclick="nextMonth()"
                >
                    ›
                </button>

            </div>


            <div class="calendar-week">

                <div class="week-day sunday">
                    일
                </div>

                <div class="week-day">
                    월
                </div>

                <div class="week-day">
                    화
                </div>

                <div class="week-day">
                    수
                </div>

                <div class="week-day">
                    목
                </div>

                <div class="week-day">
                    금
                </div>

                <div class="week-day saturday">
                    토
                </div>

            </div>


            <div
                id="calendar-grid"
                class="calendar-grid"
            ></div>

        </div>

    </section>


    <!-- =======================================
         설정
         ======================================= -->

    <section
        id="settings-section"
        class="page"
    >

        <div class="section-title">
            ⚙️ 환경설정
        </div>


        <div class="settings-card">


            <button
                class="settings-button"
                onclick="openDiaSettings()"
            >

                <span class="settings-button-title">
                    📋 근무표 설정
                </span>

                <span class="settings-button-description">
                    사용할 DIA를 선택하고 저장합니다.
                </span>

            </button>


            <button
                class="settings-button"
                onclick="showSimpleMessage('업데이트 기능은 준비 중입니다.')"
            >

                <span class="settings-button-title">
                    🔄 업데이트
                </span>

                <span class="settings-button-description">
                    철도비서 최신 버전 확인
                </span>

            </button>


            <button
                class="settings-button"
                onclick="logout()"
            >

                <span class="settings-button-title">
                    🚪 로그아웃
                </span>

                <span class="settings-button-description">
                    현재 계정에서 로그아웃합니다.
                </span>

            </button>


        </div>


        <button
            class="back-button"
            onclick="goMain()"
        >
            ← 메인으로
        </button>

    </section>


    <!-- =======================================
         간단 페이지
         ======================================= -->

    <section
        id="simple-section"
        class="page"
    >

        <div
            id="simple-title"
            class="section-title"
        >
            메뉴
        </div>


        <div class="settings-card">

            <div
                id="simple-content"
                style="
                    padding:25px 10px;
                    text-align:center;
                    color:#8994a3;
                    font-size:13px;
                "
            >
                준비 중입니다.
            </div>

        </div>


        <button
            class="back-button"
            onclick="goMain()"
        >
            ← 메인으로
        </button>

    </section>


</div>


<!-- =========================================
     DIA 선택 모달
     ========================================= -->

<div
    id="dia-modal"
    class="modal"
>

    <div class="dia-modal">

        <div class="dia-modal-header">

            <div class="dia-modal-title">
                📋 근무표 설정
            </div>


            <button
                class="close-button"
                onclick="closeDiaSettings()"
            >
                ×
            </button>

        </div>


        <div class="dia-modal-content">

            <p class="dia-description">

/*************************************************

const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzNXcKpOMeIaiOD8XZacs6pM2xjRYlytjbr9pF7SwKWMdYU5GRpl9BOsnV5YRhcxD8GpQ/exec';

/*************************************************
 * JSONP 요청
 *************************************************/

function jsonpRequest(action, params = {}) {

    return new Promise(function(resolve, reject) {

        const callbackName =
            'jsonpCallback_' +
            Date.now() +
            '_' +
            Math.floor(Math.random() * 100000);


        const script =
            document.createElement('script');


        const query =
            new URLSearchParams();


        query.append(
            'action',
            action
        );


        query.append(
            'callback',
            callbackName
        );


        Object.keys(params).forEach(function(key) {

            query.append(
                key,
                params[key]
            );

        });


        const timeout =
            setTimeout(function() {

                cleanup();

                reject(
                    new Error(
                        '서버 응답 시간이 초과되었습니다.'
                    )
                );

            }, 15000);


        window[callbackName] =
            function(data) {

                clearTimeout(timeout);

                cleanup();

                resolve(data);
            };


        function cleanup() {

            try {
                delete window[callbackName];
            } catch (e) {
                window[callbackName] = undefined;
            }


            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }
        }


        script.onerror =
            function() {

                clearTimeout(timeout);

                cleanup();

                reject(
                    new Error(
                        '서버에 연결할 수 없습니다.'
                    )
                );
            };


        script.src =
            SCRIPT_URL +
            '?' +
            query.toString();


        document
            .body
            .appendChild(script);

    });
}

async function loginUser() {

    const employeeId =
        document

            .getElementById('login-password')

/*************************************************

            .getElementById('signup-name')

async function openDiaSettings() {

    if (!currentUser) {

    document

        if (
            !diaResult ||

        ) {

            throw new Error(
                diaResult?.message ||
                'DIA 목록을 불러오지 못했습니다.'
            );

        allDiaList =
            diaResult.data || [];


        /***************************************
         * 기존 사용자 설정 가져오기
         ***************************************/

        const userResult =
            await jsonpRequest(
                'getUserDiaSettings',
                {
                    employeeId:
                        currentUser.employeeId
                }
            );


        if (
            !userResult ||
            !userResult.success
        ) {

            throw new Error(

                '사용자 설정을 불러오지 못했습니다.'
            );
        }


        selectedDiaList =

        renderDiaList();


    } catch (error) {

        document
            .getElementById('dia-list')

                '<div class="loading">' +

/*************************************************
 * DIA 목록 화면 출력
 *************************************************/

function renderDiaList() {

    const container =
        document.getElementById(
            'dia-list'
        );


    if (
        !allDiaList ||
        allDiaList.length === 0
    ) {

        container.innerHTML =
            '<div class="loading">' +
            '등록된 DIA가 없습니다.' +
            '</div>';

        updateSelectedCount();

        return;
    }


    let html = '';


    allDiaList.forEach(
        function(item, index) {

            const checked =
                selectedDiaList.includes(
                    item.dia
                );


            let timeText = '';


            if (
                item.startTime ||
                item.endTime
            ) {

                timeText =
                    (item.startTime || '-') +
                    ' ~ ' +
                    (item.endTime || '-');

            }


            if (
                item.train1 ||
                item.train2
            ) {

                const trainText =
                    [
                        item.train1,
                        item.train2
                    ]
                    .filter(Boolean)
                    .join(' / ');


                timeText +=
                    '<br>열차 ' +
                    trainText;
            }


            html +=

                '<div class="dia-item">' +

                    '<input ' +

                        'class="dia-checkbox" ' +

                        'type="checkbox" ' +

                        'id="dia-' +
                        index +
                        '" ' +

                        'value="' +
                        escapeHtml(item.dia) +
                        '" ' +

                        (checked ? 'checked' : '') +

                        'onchange="toggleDia(this)"' +

                    '>' +


                    '<label ' +

                        'class="dia-label" ' +

                        'for="dia-' +
                        index +
                        '"' +

                    '>' +

                        '<span class="dia-code">' +
                            escapeHtml(item.dia) +
                        '</span>' +

                        '<span class="dia-name">' +
                            escapeHtml(
                                item.displayName ||
                                item.type ||
                                ''
                            ) +
                        '</span>' +

                        '<span class="dia-time">' +
                            timeText +
                        '</span>' +

                    '</label>' +

                '</div>';

        }
    );


    container.innerHTML =
        html;


    updateSelectedCount();
}


/*************************************************
 * DIA 선택 / 해제
 *************************************************/

function toggleDia(checkbox) {

    const dia =
        checkbox.value;


    if (checkbox.checked) {

        if (
            !selectedDiaList.includes(dia)
        ) {

            selectedDiaList.push(dia);
        }

    } else {

        selectedDiaList =
            selectedDiaList.filter(
                function(item) {
                    return item !== dia;
                }
            );
    }


    updateSelectedCount();
}


/*************************************************
 * 선택 개수
 *************************************************/

function updateSelectedCount() {

    document
        .getElementById(
            'dia-selected-info'

        .textContent =
            '선택된 DIA ' +
            selectedDiaList.length +
            '개';

async function saveDiaSettings() {

    if (!currentUser) {

        alert(
            '로그인 정보가 없습니다.'
        );

        return;
    }


    const saveButton =

    try {

                {

                    employeeId:

                    diaList:
                        JSON.stringify(

                        )
                }
            );


        if (
            result &&
            result.success
        ) {

            alert(
                '근무표 설정이 저장되었습니다.'
            );


            closeDiaSettings();

            renderCalendar();

        } else {

            alert(
                result.message ||
                '저장에 실패했습니다.'
            );

    } catch (error) {

        console.error(error);


        alert(
            '서버 연결에 실패했습니다.'
        );


    } finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            '저장';
    }
}

 * DIA 설정 닫기
 *************************************************/

function closeDiaSettings() {

    document
        .getElementById('dia-modal')
        .classList.remove('show');
}


/*************************************************
 * 달력
 *************************************************/

function renderCalendar() {

    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    document
        .getElementById(
            'calendar-title'
        )
        .textContent =
            year +
            '년 ' +
            (month + 1) +
            '월';


    const grid =
        document
            .getElementById(
                'calendar-grid'
            );


    grid.innerHTML = '';


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const lastDate =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                'div'
            );

        empty.className =
            'empty-day';

        grid.appendChild(
            empty
        );
    }


    const today =
        new Date();


    for (
        let day = 1;
        day <= lastDate;
        day++
    ) {

        const cell =
            document.createElement(
                'div'
            );


        cell.className =
            'calendar-day';


        const date =
            new Date(
                year,
                month,
                day
            );


        const dayOfWeek =
            date.getDay();


        if (
            dayOfWeek === 0
        ) {

            cell.classList.add(
                'sunday'
            );

        }


        if (
            dayOfWeek === 6
        ) {

            cell.classList.add(
                'saturday'
            );

        }


        if (
            year === today.getFullYear() &&
            month === today.getMonth() &&
            day === today.getDate()
        ) {

            cell.classList.add(
                'today'
            );
        }


        const number =
            document.createElement(
                'span'
            );


        number.className =
            'day-number';


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        /*
         * 현재 선택된 DIA가 있다면
         * 예시로 순서대로 표시
         *
         * 실제 날짜별 근무표 DB 연결은
         * 다음 단계에서 추가 가능
         */

        if (
            selectedDiaList.length > 0
        ) {

            const index =
                (
                    firstDay +
                    day -
                    1
                ) %
                selectedDiaList.length;


            const badge =
                document.createElement(
                    'span'
                );


            badge.className =
                'dia-badge';


            badge.textContent =
                selectedDiaList[index];


            cell.appendChild(
                badge
            );
        }


        grid.appendChild(
            cell
        );
    }
}


/*************************************************
 * 이전 달
 *************************************************/

function previousMonth() {

    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    if (
        year === MIN_YEAR &&
        month === MIN_MONTH
    ) {

        return;
    }


    calendarDate =
        new Date(
            year,
            month - 1,
            1
        );


    renderCalendar();
}


/*************************************************
 * 다음 달
 *************************************************/

function nextMonth() {

    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    if (
        year === MAX_YEAR &&
        month === MAX_MONTH
    ) {

        return;
    }


    calendarDate =
        new Date(
            year,
            month + 1,
            1
        );


    renderCalendar();
}


/*************************************************
 * 시계
 *************************************************/

function updateClock() {

    const now =
        new Date();


    const formatter =
        new Intl.DateTimeFormat(
            'ko-KR',
            {
                timeZone:
                    'Asia/Seoul',

                year:
                    'numeric',

                month:
                    '2-digit',

                day:
                    '2-digit',

                weekday:
                    'short',

                hour:
                    '2-digit',

                minute:
                    '2-digit',

                second:
                    '2-digit',

                hour12:
                    false
            }
        );


    document
        .getElementById('clock')
        .textContent =
            formatter.format(now);
}


setInterval(
    updateClock,
    1000
);


/*************************************************
 * 로컬 로그인 복원
 *************************************************/

function restoreLogin() {

    try {

        const saved =
            localStorage.getItem(
                'railwaySecretaryUser'
            );


        if (!saved) {

            showLogin();

            return;
        }


        const user =
            JSON.parse(saved);


        if (
            !user ||
            !user.employeeId ||
            !user.name
        ) {

            showLogin();

            return;
        }


        currentUser =
            user;


        document
            .getElementById(
                'welcome-name'
            )
            .textContent =
                user.name;


        goMain();


    } catch (error) {

        console.error(error);

        showLogin();
    }
}


/*************************************************
 * HTML 특수문자 처리
 *************************************************/

function escapeHtml(value) {

    return String(value || '')
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );
}


/*************************************************
 * 간단 메시지
 *************************************************/

function showSimpleMessage(message) {

    alert(message);
}


/*************************************************
 * 초기 실행
 *************************************************/

document.addEventListener(
    'DOMContentLoaded',
    function() {

        updateClock();

        restoreLogin();

    }
);

</script>
