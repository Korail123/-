<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>철도비서</title>

<style>
:root {
  --primary: #0284c7;
  --primary-light: #e0f2fe;
  --primary-dark: #0369a1;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-sub: #64748b;
  --border: #e2e8f0;
  --red: #ef4444;
  --yellow: #f59e0b;
}

*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html,body{
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text-main);
}

body{
  display: flex;
  justify-content: center;
}

button,input{
  font: inherit;
}

button{
  cursor: pointer;
  border: none;
  background: none;
}

.container{
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,0.05);
}

.hidden{
  display: none !important;
}

/* Top Bar */
.topbar{
  height: 72px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.top-refresh{
  font-size: 24px;
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  transition: background 0.2s;
}
.top-refresh:active {
  background: var(--primary-light);
}

.top-title{
  text-align: center;
  font-weight: 700;
  font-size: 15px;
  color: var(--text-main);
}

.top-time{
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 1px;
}

.top-group{
  background: var(--primary-light);
  color: var(--primary-dark);
  font-weight: 700;
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 20px;
}

.section{
  padding: 20px 20px 110px;
}

.card{
  background: var(--card-bg);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

.login-wrap{
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 100vh;
}

.logo{
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  color: var(--primary);
  margin-bottom: 36px;
}

.logo small{
  display: block;
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 6px;
  font-weight: 500;
}

.input{
  width: 100%;
  height: 52px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card-bg);
  padding: 0 16px;
  font-size: 15px;
  outline: none;
  margin-bottom: 12px;
  color: var(--text-main);
  transition: all 0.2s;
}

.input:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
}

.primary{
  width: 100%;
  height: 52px;
  border-radius: 14px;
  background: var(--primary);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  margin-top: 6px;
}
.primary:active {
  background: var(--primary-dark);
}

.secondary{
  width: 100%;
  height: 48px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card-bg);
  color: var(--text-main);
  font-weight: 600;
  margin-top: 10px;
  font-size: 15px;
}

.checkrow{
  font-size: 14px;
  color: var(--text-sub);
  margin: 4px 0 16px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.msg{
  text-align: center;
  min-height: 24px;
  font-size: 13px;
  margin-top: 12px;
  color: var(--red);
  font-weight: 500;
}

.welcome{
  text-align: center;
  font-size: 18px;
  font-weight: 700;
}

.subtle{
  text-align: center;
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 6px;
}

.menu-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}

.menu-btn{
  min-height: 96px;
  border-radius: 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.02);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.menu-btn span{
  font-size: 28px;
  margin-bottom: 8px;
}

.menu-btn:active,
.nav-btn:active{
  transform: scale(0.97);
  background: var(--bg);
}

.logout{
  margin-top: 16px;
  color: var(--red);
  border-color: #fee2e2;
  background: #fef2f2;
}

.page-head{
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
}

.back{
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-title{
  font-size: 18px;
  font-weight: 700;
}

.head-spacer{
  width: 36px;
}

.sch-card{
  padding: 0;
  background: transparent;
  box-shadow: none;
  border: none;
}

.sch-nav{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 0 4px;
}

.sch-nav button{
  font-size: 24px;
  font-weight: 600;
  color: var(--text-main);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.sch-range{
  font-size: 17px;
  color: var(--text-main);
  font-weight: 700;
}

.week-head,
.week-row{
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.week-head{
  background: var(--card-bg);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  border: 1px solid var(--border);
  border-bottom: none;
}

.week-head div{
  text-align: center;
  padding: 12px 0;
  font-size: 13px;
  font-weight: 700;
}

.week-head .sun,
.day.sun{
  color: var(--red);
}

.week-head .sat,
.day.sat{
  color: var(--primary);
}

.week-row{
  min-height: 72px;
  background: var(--card-bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.week-row:last-child{
  border-bottom-left-radius: 16px;
  border-bottom-right-radius: 16px;
}

.day{
  position: relative;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  padding-top: 14px;
}

.day:last-child{
  border-right: 0;
}

.day.today{
  background: var(--primary-light);
}

.day.selected{
  background: #f1f5f9;
}

.day .num{
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 11px;
  color: var(--text-sub);
  font-weight: 600;
}

.day .holiday{
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 9px;
  color: var(--red);
}

.day .work{
  font-size: 15px;
  font-weight: 800;
  margin-top: 4px;
}

.work.week{
  color: var(--yellow);
}

.work.night,
.work.off{
  color: var(--primary);
}

.work.rest,
.work.leave{
  color: var(--red);
}

.detail{
  margin-top: 16px;
}

.detail-title{
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
}

.detail-line{
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.6;
}

.note{
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.5;
  margin-top: 12px;
  padding: 0 4px;
}

.modal-bg{
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal{
  width: 100%;
  max-width: 380px;
  max-height: 85vh;
  overflow: auto;
  background: var(--card-bg);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

.modal h3{
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
}

.modal-actions{
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.modal-actions button{
  flex: 1;
  height: 46px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
}

.ok{
  background: var(--primary);
  color: #fff;
}

.cancel{
  background: var(--bg);
  color: var(--text-sub);
  border: 1px solid var(--border);
}

.dia-grid{
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}

.dia-item{
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.dia-item strong{
  font-size: 12px;
}

.dia-item.on{
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary-dark);
}

.status-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.status-btn{
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card-bg);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-main);
}

.status-btn.on{
  background: #fef2f2;
  border-color: #fecaca;
  color: var(--red);
}

.settings-item{
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 64px;
  padding: 0 18px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 10px;
  width: 100%;
  text-align: left;
  box-shadow: 0 2px 4px rgba(15, 23, 42, 0.02);
}

.settings-item .left strong{
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
}

.settings-item .left span{
  display: block;
  color: var(--text-sub);
  font-size: 12px;
  margin-top: 2px;
}

.settings-item b{
  font-size: 20px;
  color: var(--text-sub);
}

.group-card{
  padding: 0;
  overflow: hidden;
}

.group-toolbar{
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  padding: 12px 8px 6px;
}

.group-toolbar button{
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
}

.group-range{
  text-align: center;
  color: var(--text-main);
  font-weight: 700;
  font-size: 16px;
}

.group-sync{
  text-align: center;
  font-size: 12px;
  color: var(--text-sub);
  padding-bottom: 10px;
}

.group-table-wrap{
  overflow-x: auto;
}

.group-table{
  width: 100%;
  min-width: 390px;
  border-collapse: collapse;
  table-layout: fixed;
}

.group-table th,
.group-table td{
  height: 54px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  padding: 2px;
}

.group-table th{
  height: 44px;
  font-size: 12px;
  background: var(--bg);
  color: var(--text-sub);
  font-weight: 700;
}

.group-table th.name-col,
.group-table td.name-col{
  width: 80px;
  text-align: left;
  padding-left: 14px;
  font-weight: 700;
}

.group-table th.today-col,
.group-table td.today-col{
  background: var(--primary-light);
}

.group-table td .gwork{
  font-size: 16px;
  font-weight: 800;
}

.gwork.week{ color: var(--yellow); }
.gwork.night, .gwork.off{ color: var(--primary); }
.gwork.rest, .gwork.leave{ color: var(--red); }

.group-footer{
  display: grid;
  grid-template-columns: 80px repeat(7, 1fr);
  border-top: 2px solid var(--primary);
  background: var(--bg);
}

.group-footer div{
  text-align: center;
  padding: 12px 1px;
  font-size: 13px;
  font-weight: 700;
}

.pattern-box,
.vacation-box{
  padding: 40px 20px;
  text-align: center;
  color: var(--text-sub);
  font-size: 14px;
}

.bottom-nav{
  position: fixed;
  z-index: 50;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  height: 76px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: center;
  padding: 0 4px;
}

.nav-btn{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-sub);
  font-size: 10px;
  height: 100%;
  transition: color 0.2s;
}

.nav-btn .ico{
  font-size: 20px;
  margin-bottom: 2px;
}

.nav-btn.active{
  color: var(--primary);
  font-weight: 700;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="login-section">
  <div class="login-wrap">
    <div class="logo">
      🚆 철도비서
      <small>KORAIL 근무관리 시스템</small>
    </div>
    <input id="login-id" class="input" inputmode="numeric" placeholder="사원번호">
    <input id="login-pw" class="input" type="password" placeholder="비밀번호">
    <label class="checkrow">
      <input id="remember-login" type="checkbox"> 로그인 정보 저장
    </label>
    <button class="primary" onclick="handleLogin()">로그인</button>
    <button class="secondary" onclick="switchSection('signup-section')">회원가입</button>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<!-- SIGNUP -->
<div id="signup-section" class="hidden">
  <div class="page-head">
    <button class="back" onclick="switchSection('login-section')">‹</button>
    <div class="page-title">회원가입</div>
    <div class="head-spacer"></div>
  </div>
  <div class="section">
    <div class="card">
      <input id="signup-id" class="input" inputmode="numeric" placeholder="사원번호">
      <input id="signup-name" class="input" placeholder="이름">
      <input id="signup-pw" class="input" type="password" placeholder="비밀번호">
      <input id="signup-pw2" class="input" type="password" placeholder="비밀번호 확인">
      <button class="primary" onclick="handleSignup()">가입하기</button>
      <div id="signup-msg" class="msg"></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="main-section" class="hidden">
  <div class="topbar">
    <button class="top-refresh" onclick="refreshAll()">↻</button>
    <div class="top-title">
      <div id="top-date"></div>
      <div id="top-time" class="top-time"></div>
    </div>
    <button class="top-group" onclick="openGroup()">근무그룹</button>
  </div>
  <div class="section">
    <div class="card">
      <div id="welcome" class="welcome"></div>
      <div class="subtle">오늘도 안전운행 하세요!</div>
    </div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="openSchedule()"><span>📅</span>근무표</button>
      <button class="menu-btn" onclick="openGroup()"><span>👥</span>근무그룹</button>
      <button class="menu-btn" onclick="openPattern()"><span>🔄</span>근무패턴</button>
      <button class="menu-btn" onclick="openVacation()"><span>🏖️</span>휴가관리</button>
      <button class="menu-btn" onclick="openSettings()"><span>⚙️</span>환경설정</button>
      <button class="menu-btn" onclick="alert('사이트 기능은 다음 업데이트에서 연결됩니다.')"><span>🌐</span>사이트</button>
    </div>
    <button class="secondary logout" onclick="logout()">로그아웃</button>
  </div>
</div>

<!-- SCHEDULE -->
<div id="schedule-section" class="hidden">
  <div class="page-head">
    <button class="back" onclick="switchSection('main-section')">‹</button>
    <div class="page-title">근무표</div>
    <div class="head-spacer"></div>
  </div>
  <div class="section">
    <div class="sch-card">
      <div class="sch-nav">
        <button onclick="moveScheduleMonth(-1)">‹</button>
        <div id="sch-range" class="sch-range"></div>
        <button onclick="moveScheduleMonth(1)">›</button>
      </div>
      <div id="calendar"></div>
      <div id="day-detail" class="card detail"></div>
      <div class="note">
        ※ 날짜를 길게 누르면 근무를 직접 변경할 수 있습니다.<br>
        ※ 직접 변경된 근무에는 * 표시가 붙습니다.
      </div>
    </div>
  </div>
</div>

<!-- GROUP -->
<div id="group-section" class="hidden">
  <div class="page-head">
    <button class="back" onclick="switchSection('main-section')">‹</button>
    <div class="page-title">근무그룹</div>
    <div class="head-spacer"></div>
  </div>
  <div class="section">
    <div class="group-card card">
      <div class="group-toolbar">
        <button onclick="moveGroupWeek(-7)">‹</button>
        <div id="group-range" class="group-range"></div>
        <button onclick="moveGroupWeek(7)">›</button>
      </div>
      <div id="group-sync" class="group-sync">서버 연결 중...</div>
      <div id="group-table-wrap" class="group-table-wrap"></div>
    </div>
    <div class="note">
      ※ 회원정보 시트에 현재 등록된 회원만 표시됩니다.<br>
      ※ 각 회원의 DIA와 직접 수정한 근무가 서버 기준으로 반영됩니다.
    </div>
  </div>
</div>

<!-- PATTERN -->
<div id="pattern-section" class="hidden">
  <div class="page-head">
    <button class="back" onclick="switchSection('main-section')">‹</button>
    <div class="page-title">근무패턴</div>
    <div class="head-spacer"></div>
  </div>
  <div class="section">
    <div class="card pattern-box">교대제 및 순환 근무 패턴을 설정하는 화면입니다.</div>
  </div>
</div>

<!-- VACATION -->
<div id="vacation-section" class="hidden">
  <div class="page-head">
    <button class="back" onclick="switchSection('main-section')">‹</button>
    <div class="page-title">휴가관리</div>
    <div class="head-spacer"></div>
  </div>
  <div class="section">
    <div class="card vacation-box">휴가관리 기능을 준비 중입니다.</div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-section" class="hidden">
  <div class="page-head">
    <button class="back" onclick="switchSection('main-section')">‹</button>
    <div class="page-title">환경설정</div>
    <div class="head-spacer"></div>
  </div>
  <div class="section">
    <button class="settings-item" onclick="openDiaSelector()">
      <div class="left"><strong>근무 설정</strong><span>오늘의 다이아를 최초 1회 지정</span></div>
      <b>›</b>
    </button>
    <button class="settings-item" onclick="alert('출근알람 설정 팝업은 다음 통합 단계에서 연결됩니다.')">
      <div class="left"><strong>출근알람</strong><span>출근 알림 및 알람볼륨</span></div>
      <b>›</b>
    </button>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzNXcKpOMeIaiOD8XZacs6pM2xjRYlytjbr9pF7SwKWMdYU5GRpl9BOsnV5YRhcxD8GpQ/exec';
const USER_KEY = 'railwaySecretaryUser';
const DIA_CACHE_KEY = 'railwaySecretaryDiaDB';
const DIA_USER_PREFIX = 'railwaySecretaryDia_';
const OVERRIDE_LOCAL_PREFIX = 'railwaySecretaryScheduleOverrides_';
const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
const STATUS_LIST = ['연차', '육아휴직', '돌봄', '출산휴가', '병가', '공가', '휴무'];

let currentUser = null;
let diaData = [];
let selectedDia = null;
let pendingDiaSeq = '';
let calendarYear = 2026;
let calendarMonth = 10;
let selectedDate = null;
let editDate = '';
let selectedEditStatus = '';
let groupStartDate = '';
let groupTimer = null;
let syncBusy = false;

function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function lsSet(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
function lsRemove(k){ try{localStorage.removeItem(k)}catch(e){} }
function ssGet(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }
function ssSet(k,v){ try{sessionStorage.setItem(k,v)}catch(e){} }
function ssRemove(k){ try{sessionStorage.removeItem(k)}catch(e){} }

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function parseDate(s){
  const p = s.split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2]);
}

function dateStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function addDays(s, n){
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return dateStr(d);
}

function diffDays(a, b){
  return Math.round((parseDate(b) - parseDate(a)) / 86400000);
}

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[m];
  });
}

function jsonp(action, params={}, timeout=15000){
  return new Promise(function(resolve, reject){
    const cb = 'railwayCb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(function(){ finish(new Error('서버 응답 시간 초과')); }, timeout);

    function finish(err, data){
      if(done) return;
      done = true;
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      script.remove();
      if(err) reject(err); else resolve(data);
    }

    window[cb] = function(data){ finish(null, data); };
    const q = new URLSearchParams({...params, action, callback:cb, _t:Date.now()});
    script.src = GAS_URL + '?' + q.toString();
    script.onerror = function(){ finish(new Error('서버 연결에 실패했습니다.')); };
    document.body.appendChild(script);
  });
}

function switchSection(id){
  ['login-section','signup-section','main-section','schedule-section','group-section','pattern-section','vacation-section','settings-section'].forEach(function(x){
    document.getElementById(x).classList.toggle('hidden', x !== id);
  });
  const logged = !!currentUser && id !== 'login-section' && id !== 'signup-section';
  document.getElementById('bottom-nav').classList.toggle('hidden', !logged);
  
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  const map = {
    'main-section': 'nav-main',
    'schedule-section': 'nav-schedule',
    'group-section': 'nav-group',
    'pattern-section': 'nav-pattern',
    'vacation-section': 'nav-vacation',
    'settings-section': 'nav-settings'
  };
  if(map[id]) document.getElementById(map[id]).classList.add('active');
}

function updateClock(){
  const d = new Date();
  document.getElementById('top-date').textContent = d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + String(d.getDate()).padStart(2,'0') + '일 (' + DAY_NAMES[d.getDay()] + ')';
  document.getElementById('top-time').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}
setInterval(updateClock, 1000);
updateClock();

function normalizeDia(x, i){
  return {
    order: Number(x.order || i+1),
    seq: String(x.seq || x.order || i+1),
    dia: String(x.dia || ''),
    type: String(x.type || ''),
    start: String(x.start || ''),
    end: String(x.end || ''),
    train1: String(x.train1 || ''),
    train2: String(x.train2 || '')
  };
}

function saveDiaCache(){ lsSet(DIA_CACHE_KEY, JSON.stringify(diaData)); }
function loadDiaCache(){
  try{
    const a = JSON.parse(lsGet(DIA_CACHE_KEY) || '[]');
    if(Array.isArray(a) && a.length) diaData = a.map(normalizeDia);
  }catch(e){}
}

async function loadDiaFromServer(){
  try{
    const r = await jsonp('getDia');
    if(r && r.success && Array.isArray(r.list)){
      diaData = r.list.map(normalizeDia);
      saveDiaCache();
      return true;
    }
  }catch(e){}
  return false;
}

function loadUserFromStorage(){
  let raw = lsGet(USER_KEY);
  if(!raw) raw = ssGet(USER_KEY);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

function saveUser(u, remember){
  const raw = JSON.stringify(u);
  if(remember){ lsSet(USER_KEY, raw); ssRemove(USER_KEY); }
  else{ ssSet(USER_KEY, raw); lsRemove(USER_KEY); }
}

function clearUser(){ lsRemove(USER_KEY); ssRemove(USER_KEY); }

async function handleLogin(){
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const msg = document.getElementById('login-msg');

  if(!id || !pw){ msg.textContent = '사원번호와 비밀번호를 입력해주세요.'; return; }
  msg.textContent = '로그인 중입니다...';

  try{
    const r = await jsonp('login', {employeeId:id, password:pw});
    if(!r.success){ msg.textContent = r.message || '로그인에 실패했습니다.'; return; }

    currentUser = { employeeId: r.employeeId, name: r.name, token: r.token };
    saveUser(currentUser, document.getElementById('remember-login').checked);
    await afterLogin();
  }catch(e){
    msg.textContent = e.message;
  }
}

async function handleSignup(){
  const id = document.getElementById('signup-id').value.trim();
  const name = document.getElementById('signup-name').value.trim();
  const pw = document.getElementById('signup-pw').value;
  const pw2 = document.getElementById('signup-pw2').value;
  const msg = document.getElementById('signup-msg');

  if(!id || !name || !pw){ msg.textContent = '모든 항목을 입력해주세요.'; return; }
  if(pw !== pw2){ msg.textContent = '비밀번호가 일치하지 않습니다.'; return; }

  msg.textContent = '회원가입 처리 중입니다...';
  try{
    const r = await jsonp('signup', {employeeId:id, name, password:pw});
    if(!r.success){ msg.textContent = r.message || '회원가입에 실패했습니다.'; return; }
    alert('회원가입이 완료되었습니다. 로그인해주세요.');
    switchSection('login-section');
  }catch(e){
    msg.textContent = e.message;
  }
}

async function afterLogin(){
  document.getElementById('welcome').textContent = currentUser.name + '님 환영합니다!';
  loadDiaCache();
  loadUserDiaSettings();
  loadOverrides();
  switchSection('main-section');
  loadDiaFromServer();
}

function logout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  currentUser = null;
  clearUser();
  switchSection('login-section');
}

function openSettings(){ switchSection('settings-section'); }
function openSchedule(){
  const now = new Date();
  calendarYear = now.getFullYear();
  calendarMonth = now.getMonth() + 1;
  renderCalendar();
  switchSection('schedule-section');
}
function openPattern(){ switchSection('pattern-section'); }
function openVacation(){ switchSection('vacation-section'); }

function openDiaSelector(){
  const grid = document.getElementById('dia-grid');
  grid.innerHTML = '';
  if(!diaData.length){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;">불러온 다이아 정보가 없습니다.</div>';
  } else {
    diaData.forEach(function(item){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dia-item' + (pendingDiaSeq === item.seq ? ' on' : '');
      btn.innerHTML = '<strong>' + esc(item.dia || item.seq) + '</strong><span>' + esc(item.type) + '</span>';
      btn.onclick = function(){
        pendingDiaSeq = item.seq;
        openDiaSelector();
      };
      grid.appendChild(btn);
    });
  }
  document.getElementById('dia-modal').classList.remove('hidden');
}

function closeModal(id){ document.getElementById(id).classList.add('hidden'); }

function saveSelectedDia(){
  if(!pendingDiaSeq){ alert('다이아를 선택해주세요.'); return; }
  const settingKey = DIA_USER_PREFIX + (currentUser ? currentUser.employeeId : 'guest');
  lsSet(settingKey, JSON.stringify({seq: pendingDiaSeq, baseDate: todayStr()}));
  selectedDia = {seq: pendingDiaSeq, baseDate: todayStr()};
  closeModal('dia-modal');
  alert('근무 설정이 저장되었습니다.');
}

function loadUserDiaSettings(){
  const settingKey = DIA_USER_PREFIX + (currentUser ? currentUser.employeeId : 'guest');
  try{
    const d = JSON.parse(lsGet(settingKey));
    if(d) selectedDia = d;
  }catch(e){ selectedDia = null; }
}

  // Overrides placeholder
}

function renderCalendar(){
  document.getElementById('sch-range').textContent = calendarYear + '년 ' + calendarMonth + '월';
  const cal = document.getElementById('calendar');
  cal.innerHTML = `
    <div class="week-head">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
    </div>
  `;
  // Simple calendar render framework
  let row = document.createElement('div');
  row.className = 'week-row';
  
  const firstDay = new Date(calendarYear, calendarMonth - 1, 1).getDay();
  const lastDate = new Date(calendarYear, calendarMonth, 0).getDate();

  for(let i=0; i<firstDay; i++){
    let d = document.createElement('div');
    d.className = 'day';
    row.appendChild(d);
  }

  for(let i=1; i<=lastDate; i++){
    if((firstDay + i - 1) % 7 === 0 && i !== 1){
      cal.appendChild(row);
      row = document.createElement('div');
      row.className = 'week-row';
    }
    let d = document.createElement('div');
    d.className = 'day';
    if(i === new Date().getDate() && calendarMonth === new Date().getMonth()+1) d.classList.add('today');
    d.innerHTML = `<span class="num">${i}</span><span class="work week">주간</span>`;
    row.appendChild(d);
  }
  cal.appendChild(row);
}

function moveScheduleMonth(n){
  calendarMonth += n;
  if(calendarMonth > 12){ calendarMonth = 1; calendarYear++; }
  else if(calendarMonth < 1){ calendarMonth = 12; calendarYear--; }
  renderCalendar();
}
