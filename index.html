    /* ============================================================
       회원가입
    ============================================================ */

    function signup() {

        const employeeId =
            document.getElementById("signupEmployeeId")
                .value.trim();

        const name =
            document.getElementById("signupName")
                .value.trim();

        const password =
            document.getElementById("signupPassword")
                .value.trim();


        if (!employeeId || !name || !password) {

            document.getElementById("signupMessage")
                .textContent =
                "모든 항목을 입력해주세요.";

            return;

        }


        document.getElementById("signupMessage")
            .textContent =
            "회원가입 처리 중입니다...";


        jsonp(
            "signup",
            {
                employeeId: employeeId,
                name: name,
                password: password
            },
            function(result) {

                if (result.success) {

                    document.getElementById("signupMessage")
                        .style.color = "#1479e9";

                    document.getElementById("signupMessage")
                        .textContent =
                        result.message || "회원가입이 완료되었습니다.";

                    setTimeout(function() {

                        showLogin();

                    }, 700);

                } else {

                    document.getElementById("signupMessage")
                        .style.color = "#e5484d";

                    document.getElementById("signupMessage")
                        .textContent =
                        result.message || "회원가입에 실패했습니다.";

                }

            }
        );

    }


    /* ============================================================
       로그인
    ============================================================ */

    function login() {

        const employeeId =
            document.getElementById("loginEmployeeId")
                .value.trim();

        const password =
            document.getElementById("loginPassword")
                .value.trim();


        if (!employeeId || !password) {

            document.getElementById("loginMessage")
                .textContent =
                "사원번호와 비밀번호를 입력해주세요.";

            return;

        }


        document.getElementById("loginMessage")
            .textContent =
            "로그인 중입니다...";


        jsonp(
            "login",
            {
                employeeId: employeeId,
                password: password
            },
            function(result) {

                if (result.success) {

                    currentUser = {

                        employeeId:
                            result.employeeId || employeeId,

                        name:
                            result.name || ""

                    };


                    localStorage.setItem(
                        "railwaySecretaryUser",
                        JSON.stringify(currentUser)
                    );


                    enterMain();

                } else {

                    document.getElementById("loginMessage")
                        .textContent =
                        result.message ||
                        "로그인에 실패했습니다.";

                }

            }
        );

    /* ============================================================
       로그아웃
    ============================================================ */

    function logout() {

        if (!confirm("로그아웃하시겠습니까?")) {

            return;

        }


        localStorage.removeItem(
            "railwaySecretaryUser"
        );

    }


    /* ============================================================
       DIA 목록 가져오기
    ============================================================ */

    function loadDiaList(callback) {

        jsonp(
            "getDiaList",
            {},
            function(result) {

                if (
                    result &&
                    result.success &&
                    Array.isArray(result.data)
                ) {

                    diaList =
                        result.data.map(function(item) {

                            return item.dia ||
                                   item.DIA ||
                                   item.code ||
                                   item;

                        });

                } else {

                    diaList =
                        DEFAULT_DIAS.slice();

                }


                if (callback) {

                    callback();

                }

            }
        );

    }


    /* ============================================================
       사용자 DIA 설정 가져오기
    ============================================================ */

    function loadUserDiaSettings() {

        if (!currentUser) {

            return;

        }


        loadDiaList(function() {

            jsonp(
                "getUserDiaSettings",
                {
                    employeeId:
                        currentUser.employeeId
                },
                function(result) {

                    if (
                        result &&
                        result.success &&
                        Array.isArray(result.data)
                    ) {

                        selectedDias =
                            result.data;

                    } else {

                        selectedDias =
                            DEFAULT_DIAS.slice();

                    }


                    if (!selectedDias.length) {

                        selectedDias =
                            DEFAULT_DIAS.slice();

                    }


                    renderCalendar();

                    updateSelectedDiaText();

                }
            );

        });

    }


    /* ============================================================
       DIA 설정 화면
    ============================================================ */

    function openDiaSetting() {

        loadDiaList(function() {

            const modal =
                document.getElementById("diaModal");

            const list =
                document.getElementById("diaList");

            list.innerHTML = "";


            const source =
                diaList.length
                    ? diaList
                    : DEFAULT_DIAS;


            source.forEach(function(dia) {

                const button =
                    document.createElement("button");

                button.className =
                    "dia-select-btn";


                if (
                    selectedDias.includes(
                        String(dia)
                    )
                ) {

                    button.classList.add("selected");

                }


                button.textContent = dia;


                button.onclick = function() {

                    toggleDiaSelection(
                        String(dia),
                        button
                    );

                };


                list.appendChild(button);

            });


            modal.classList.remove("hidden");

        });

    }


    function closeDiaSetting() {

        document.getElementById("diaModal")
            .classList.add("hidden");

    }


    function toggleDiaSelection(dia, button) {

        const index =
            selectedDias.indexOf(dia);


        if (index >= 0) {

            selectedDias.splice(index, 1);

            button.classList.remove("selected");

        } else {

            selectedDias.push(dia);

            button.classList.add("selected");

        }


        saveUserDiaSettings();

    }


    function saveUserDiaSettings() {

        if (!currentUser) {

            return;

        }


        jsonp(
            "saveUserDiaSettings",
            {
                employeeId:
                    currentUser.employeeId,

                dias:
                    JSON.stringify(selectedDias)
            },
            function(result) {

                if (
                    result &&
                    result.success
                ) {

                    renderCalendar();

                    updateSelectedDiaText();

                }

            }
        );

    }


    function updateSelectedDiaText() {

        const element =
            document.getElementById(
                "selectedDiaText"
            );


        if (!element) {

            return;

        }


        if (!selectedDias.length) {

            element.textContent =
                "선택된 DIA가 없습니다.";

            return;

        }


        element.textContent =
            selectedDias.join(", ");

    }


    /* ============================================================
       달력
    ============================================================ */

    function renderCalendar() {

        const grid =
            document.getElementById(
                "calendarGrid"
            );


        if (!grid) {

            return;

        }


        grid.innerHTML = "";


        const year =
            currentDate.getFullYear();

        const month =
            currentDate.getMonth();


        document.getElementById("monthTitle")
            .textContent =
            year + "년 " + (month + 1) + "월";


        const firstDay =
            new Date(year, month, 1)
                .getDay();


        const lastDate =
            new Date(year, month + 1, 0)
                .getDate();


        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            const empty =
                document.createElement("div");

            empty.className =
                "day-cell empty-day";

            grid.appendChild(empty);

        }


        for (
            let day = 1;
            day <= lastDate;
            day++
        ) {

            const cell =
                document.createElement("div");

            cell.className =
                "day-cell";


            const number =
                document.createElement("div");

            number.className =
                "day-number";

            number.textContent =
                day;


            const today =
                new Date();


            if (
                today.getFullYear() === year &&
                today.getMonth() === month &&
                today.getDate() === day
            ) {

                cell.classList.add("today");

            }


            cell.appendChild(number);


            const dia =
                getDiaForDate(
                    year,
                    month,
                    day
                );


            if (dia) {

                const button =
                    document.createElement("button");

                button.className =
                    "dia-button";

                button.textContent =
                    dia;


                /*
                   ★ 핵심
                   
                   DIA 클릭 → 행로표 PNG 팝업
                */

                button.onclick = function() {

                    openRouteImage(dia);

                };


                cell.appendChild(button);

            }


            grid.appendChild(cell);

        }

    }


    /*
       현재는 선택된 DIA를 날짜에 순서대로 배치하는
       임시 근무표 로직.

       실제 근무패턴을 연결할 때 이 함수만 교체하면 됨.
    */

    function getDiaForDate(year, month, day) {

        if (!selectedDias.length) {

            return "";

        }


        const index =
            Math.abs(
                (
                    year * 365 +
                    month * 31 +
                    day
                )
            ) % selectedDias.length;


        return selectedDias[index];

    }


    function changeMonth(amount) {

        currentDate.setMonth(
            currentDate.getMonth() + amount
        );


        renderCalendar();

    }


    /* ============================================================
       ★ DIA → 행로표 PNG
    ============================================================ */

    function getRouteImageCandidates(dia) {

        const encodedDia =
            encodeURIComponent(dia);


        const candidates = [];


        /*
           1순위:
           직접 등록된 URL
        */

        if (DIA_ROUTE_IMAGES[dia]) {

            candidates.push(
                DIA_ROUTE_IMAGES[dia]
            );

        }


        /*
           2순위:
           DIA.png
        */

        candidates.push(
            GITHUB_RAW_BASE +
            encodedDia +
            ".png"
        );


        /*
           3순위:
           dia_DIA.png
        */

        candidates.push(
            GITHUB_RAW_BASE +
            "dia_" +
            encodedDia +
            ".png"
        );


        /*
           4순위:
           DIA.PNG
        */

        candidates.push(
            GITHUB_RAW_BASE +
            encodedDia +
            ".PNG"
        );


        return [
            ...new Set(candidates)
        ];

    }


    function openRouteImage(dia) {

        /*
           휴무 / 연차 등은 행로표가 없으므로
           별도 처리
        */

        const nonWorkDias = [
            "휴무",
            "연차",
            "병가",
            "출산",
            "육아",
            "X"
        ];


        if (
            nonWorkDias.includes(
                String(dia)
            )
        ) {

            showToast(
                dia + "는 행로표가 없습니다."
            );

            return;

        }


        currentRouteDia =
            String(dia);


        routeZoom = 1;


        const modal =
            document.getElementById(
                "routeModal"
            );


        const image =
            document.getElementById(
                "routeImage"
            );


        const loading =
            document.getElementById(
                "routeLoading"
            );


        const error =
            document.getElementById(
                "routeError"
            );


        const title =
            document.getElementById(
                "routeHeaderTitle"
            );


        title.textContent =
            "DIA " + dia + " 행로표";


        image.classList.add("hidden");

        error.classList.add("hidden");

        loading.classList.remove("hidden");


        modal.classList.add("show");


        const candidates =
            getRouteImageCandidates(dia);


        tryNextRouteImage(
            candidates,
            0
        );

    }


    function tryNextRouteImage(
        candidates,
        index
    ) {

        const image =
            document.getElementById(
                "routeImage"
            );


        const loading =
            document.getElementById(
                "routeLoading"
            );


        const error =
            document.getElementById(
                "routeError"
            );


        if (
            index >= candidates.length
        ) {

            loading.classList.add(
                "hidden"
            );

            image.classList.add(
                "hidden"
            );


            error.innerHTML =

                "<strong>DIA " +
                escapeHtml(currentRouteDia) +
                "</strong>" +

                "등록된 행로표 PNG를 찾을 수 없습니다.<br><br>" +

                "GitHub 파일명이 DIA 번호와 같은지 확인해주세요.<br>" +

                "예: <b>" +
                escapeHtml(currentRouteDia) +
                ".png</b>";

            error.classList.remove(
                "hidden"
            );

            return;

        }


        const url =
            candidates[index];


        const testImage =
            new Image();


        testImage.onload =
            function() {

                currentRouteImageUrl =
                    url;


                image.src =
                    url;


                image.style.width =
                    "auto";


                image.style.transform =
                    "scale(1)";


                loading.classList.add(
                    "hidden"
                );


                error.classList.add(
                    "hidden"
                );


                image.classList.remove(
                    "hidden"
                );

            };


        testImage.onerror =
            function() {

                tryNextRouteImage(
                    candidates,
                    index + 1
                );

            };


        testImage.src =
            url + "?v=" +
            Date.now();

    }


    /* ============================================================
       행로표 확대 / 축소
    ============================================================ */

    function zoomRoute(amount) {

        routeZoom += amount;


        if (routeZoom < 0.5) {

            routeZoom = 0.5;

        }


        if (routeZoom > 4) {

            routeZoom = 4;

        }


        applyRouteZoom();

    }


    function resetRouteZoom() {

        routeZoom = 1;

        applyRouteZoom();

    }


    function applyRouteZoom() {

        const image =
            document.getElementById(
                "routeImage"
            );


        image.style.transform =
            "scale(" +
            routeZoom +
            ")";


        image.style.transformOrigin =
            "top left";

    }

            return;

    /* ============================================================
       Apps Script JSONP
    ============================================================ */

    function jsonp(
        action,
        params,
        callback
    ) {

        const callbackName =
            "jsonpCallback_" +
            Date.now() +
            "_" +
            Math.floor(
                Math.random() * 10000
            );


        const script =
            document.createElement(
                "script"
            );


        const query =
            new URLSearchParams();


        query.set(
            "action",
            action
        );


        query.set(
            "callback",
            callbackName
        );


        Object.keys(params || {})
            .forEach(function(key) {

                query.set(
                    key,
                    params[key]
                );

            });


        window[callbackName] =
            function(data) {

                try {

                    callback(data);

                } finally {

                    delete window[
                        callbackName
                    ];

                    script.remove();

                }

            };


        script.onerror =
            function() {

                delete window[
                    callbackName
                ];

                script.remove();


                callback({

                    success: false,

                    message:
                        "서버와 연결할 수 없습니다."

                });

            };


        script.src =
            SCRIPT_URL +
            "?" +
            query.toString();


        document.body.appendChild(
            script
        );

    }


    /* ============================================================
       업데이트
    ============================================================ */

    function checkUpdate() {

        showToast(
            "현재 최신 버전을 확인하고 있습니다."
        );

        setTimeout(function() {

            showToast(
                "현재 사용 가능한 최신 버전입니다."
            );

        }, 900);

    }


    /* ============================================================
       Toast
    ============================================================ */

    let toastTimer = null;


    function showToast(message) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(function() {

                toast.classList.remove(
                    "show"
                );

            }, 2200);

    }


    /* ============================================================
       HTML escape
    ============================================================ */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>
